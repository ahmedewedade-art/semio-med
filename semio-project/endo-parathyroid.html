<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QCM – Pathologies des parathyroïdes</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2330;--mut:#6a7285;--bd:#d9dde8;--ok:#1e8e4e;--ko:#c62828;--mis:#e08a00;--ac:#3457d5}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2030;--tx:#e8ebf3;--mut:#9aa3b8;--bd:#2c3348;--ok:#4cd98a;--ko:#ff6b6b;--mis:#ffb84d;--ac:#7c9bff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif;padding:12px;max-width:820px;margin:auto}
h1{font-size:1.3rem}.pg{margin:22px 0 6px;color:var(--ac);font-weight:700;border-bottom:2px solid var(--ac)}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}
.st{font-weight:600;margin-bottom:8px}.o{display:flex;gap:8px;padding:6px 8px;border:1px solid var(--bd);border-radius:8px;margin:4px 0;cursor:pointer}
.o.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}.o.ko{border-color:var(--ko);background:color-mix(in srgb,var(--ko) 15%,transparent)}.o.mis{border-color:var(--mis);background:color-mix(in srgb,var(--mis) 15%,transparent)}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:.95rem;cursor:pointer;margin-top:6px}
.ex{display:none;margin-top:8px;padding:8px;border-left:4px solid var(--ac);color:var(--mut);font-size:.92rem}
#bar{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#sc{font-weight:700}
</style>
</head>
<body>
<h1>QCM difficile – Pathologies des parathyroïdes (réponses multiples, A à E)</h1>
<div id="bar"><button onclick="all_()">Tout corriger</button><button onclick="location.reload()" style="background:var(--mut)">Recommencer</button><span id="sc"></span></div>
<div id="app"></div>
<script>
// [page, énoncé, [A,B,C,D,E], bonnes réponses, justification]
const Q=[
[2,"Concernant les parathyroïdes :",["Elles sont caractérisées par une variabilité extrême (nombre, siège, dimension)","Leur nombre est toujours fixe : quatre","Elles interviennent de façon majeure dans la régulation du métabolisme phosphocalcique","Ce sont des glandes exocrines","Elles sécrètent la calcitonine"],"AC","Ce sont des glandes endocrines sécrétant la PTH (B, D, E faux) ; le nombre varie (glandes manquantes ou surnuméraires)."],
[3,"Rappel anatomique :",["Il existe habituellement 4 glandes : 2 supérieures et 2 inférieures","Les inférieures siègent derrière le pôle inférieur du lobe latéral de la thyroïde","Les supérieures siègent à 1 cm au-dessus de l'union 1/3 supérieur – 1/3 moyen","Les glandes surnuméraires n'existent pas","Un siège ectopique n'est jamais observé"],"ABC","Des glandes surnuméraires et des sièges ectopiques existent (D, E faux)."],
[4,"La parathormone (PTH) :",["Est sécrétée par les parathyroïdes","Agit sur l'os, le rein et l'intestin","Assure en grande partie la régulation du métabolisme phosphocalcique","Agit principalement sur le foie","Agit directement sur la thyroïde"],"ABC","Les trois organes cibles sont l'os, le rein et l'intestin (D, E faux)."],
[5,"Action de la PTH sur l'os :",["Mobilise le calcium osseux pour assurer une calcémie normale","Entraîne une ostéolyse","Favorise la fixation osseuse du calcium","Mobilise aussi le phosphore osseux","Diminue la calcémie"],"ABD","La PTH est hypercalcémiante par ostéolyse (C, E faux) et mobilise aussi le phosphore."],
[6,"Action de la PTH sur le rein et l'intestin :",["Augmente la réabsorption tubulaire du calcium","Dans l'HPP, l'hypercalciurie est passive, consécutive à l'hypercalcémie","Diminue l'absorption intestinale du calcium","Augmente l'absorption intestinale du Ca surtout en présence de vitamine D","Provoque biologiquement une hypercalcémie et une hypercalciurie"],"ABDE","L'absorption intestinale est augmentée, pas diminuée (C faux). L'hypercalciurie est liée à la charge filtrée de Ca malgré la réabsorption accrue."],
[7,"Action de la PTH sur le phosphore :",["Mobilise très rapidement le phosphore osseux","Augmente fortement la phosphaturie par inhibition de la réabsorption tubulaire","Provoque une hypophosphatémie par perte de phosphore","Provoque une hyperphosphatémie","Diminue la phosphaturie"],"ABC","Hyperphosphaturie → hypophosphatémie (D, E faux)."],
[8,"Régulation de la sécrétion de PTH :",["Le stimulus majeur est l'hypocalcémie","L'hypercalcémie freine la sécrétion","Le rachitisme peut entraîner une hyperparathyroïdie secondaire","L'hypercalcémie stimule la sécrétion","L'hyperphosphatémie est le stimulus majeur"],"ABC","Hyperparathyroïdie secondaire = réponse à une baisse (ou tendance à la baisse) de la calcémie (D, E faux)."],
[9,"HPP : diagnostic. Signes majeurs évocateurs :",["Signes osseux","Signes rénaux","Signes digestifs","Hypoexcitabilité neuromusculaire","Signes cutanéo-phanériens"],"ABCD","Quatre ordres de signes ; les signes cutanés et phanériens relèvent de l'hypoparathyroïdie. Le développement très progressif impose un diagnostic avant le tableau complet."],
[10,"HPP : douleurs osseuses :",["Siègent volontiers sur les os longs et le rachis","Sont exagérées par l'effort et la fatigue","Résistent aux antalgiques","Sont calmées par l'effort","Sont provoquées par la pression des os"],"ABCE","Elles sont tenaces, d'intensité variable, aggravées (et non calmées) par l'effort."],
[11,"HPP : tuméfactions et fractures osseuses :",["Les tuméfactions sont moins fréquentes","Elles siègent surtout au fémur, au tibia, à la mâchoire","Elles sont profondes, fixes, souvent sensibles","Les fractures spontanées sont précoces","Les fractures spontanées sont plus tardives, sur déformation ou non"],"ABCE","Les fractures spontanées sont tardives (D faux)."],
[12,"HPP : signes rénaux :",["Lithiase et néphropathie interstitielle sont intriquées","Syndrome polyuro-polydipsie de 3 à 5 L/24 h","Urines pâles de faible densité","Urines concentrées de forte densité","Le syndrome polyuro-polydipsie est lié à l'hypercalcémie"],"ABCE","Polyurie hypotonique par hyperCa (néphropathie interstitielle) : urines diluées (D faux)."],
[13,"HPP : autres signes rénaux :",["Coliques néphrétiques répétées, uni- ou bilatérales","Hématurie possible","Néphrocalcinose possible","Les infections urinaires sont rares et sans effet sur le rein","L'insuffisance rénale peut ouvrir la scène et gêner le diagnostic"],"ABCE","Cystite et pyélonéphrite sont fréquentes et aggravent l'atteinte rénale (D faux)."],
[14,"HPP : signes digestifs (fréquents et trompeurs) :",["Nausées persistantes, crises de vomissements, constipation","Ulcères digestifs fréquents, multiples, récidivants","Pancréatites associées aux ulcères, hyperacidité gastrique","Diarrhée profuse, signe constant","Manifestations fonctionnelles pouvant égarer le diagnostic"],"ABCE","La constipation (et non la diarrhée) est classique (D faux)."],
[15,"HPP : manifestations neuromusculaires :",["Pratiquement constantes","Asthénie","Hypotonie musculaire très fréquente, parfois extrême","Dépression, voire états confusionnels","Hyperexcitabilité avec tétanie"],"ABCD","L'HPP donne une hypoexcitabilité ; la tétanie relève de l'hypoCa (E faux)."],
[16,"HPP : autres signes :",["Raccourcissement de l'espace QT","Allongement de l'espace QT","Calcifications métastatiques tardives, inconstantes, uniquement radiologiques","Tumeur cervicale palpable rare","Tumeur cervicale constante"],"ACD","L'hypercalcémie raccourcit le QT (B faux) ; la tumeur cervicale est rare (E faux)."],
[17,"HPP : signes radiologiques osseux :",["Hyperclarté osseuse, élargissement du canal médullaire, atrophie corticale à bordure interne festonnée","Géodes","Crâne d'aspect délavé (tables interne et externe)","Géodes + déminéralisation = ostéite fibrokystique de Recklinghausen","Densification diffuse des corticales"],"ABCD","La densification des corticales est décrite dans l'hypoparathyroïdie (E faux)."],
[18,"HPP : diagnostic topographique et ASP :",["L'ASP fait partie du bilan radiologique (lithiase, calcifications)","L'échographie peut aider à localiser l'adénome","La scintigraphie au sestamibi est marquée au technétium 99","La scintigraphie à l'iode 131 est l'examen de référence","Le diagnostic est exclusivement topographique"],"ABC","Le sestamibi est marqué au Tc99 (D, E faux)."],
[19,"HPP : formes cliniques :",["Forme asymptomatique suspectée par la biologie","Forme osseuse avec condensation simulant une maladie de Paget","Forme à géode unique simulant un kyste ou une tumeur osseuse","Déminéralisation diffuse sans géode simulant une ostéomalacie pure","Forme avec hypocalcémie constante"],"ABCD","Il existe aussi des formes rénales ; l'HPP donne une hypercalcémie, pas une hypocalcémie (E faux)."],
[20,"HPP : biologie – valeurs seuils :",["Calcémie > 110 mg/L (2,6 mmol/L) sur 3 dosages","Calciurie > 400 mg/24 h","Phosphatémie < 0,8 mmol/L, parfois normale","Phosphatémie souvent élevée","PTH basse"],"ABC","Hypophosphatémie, jamais élevée ; PTH élevée (D, E faux)."],
[20,"HPP : conditions et autres résultats biologiques :",["Hypercalcémie franche et constante","Plusieurs échantillons pour la calciurie","Régime normocalcique pour interpréter la calciurie","Hyperphosphaturie > 25 mg/L","Phosphaturie < 25 mg/L"],"ABCD","Hyperphosphaturie liée à l'inhibition de la réabsorption tubulaire (E faux)."],
[21,"Hypoparathyroïdie : étiologies et physiopathologie :",["Destruction chirurgicale des glandes","Radiothérapie","Forme idiopathique","Hypocalcémie par augmentation de l'ostéolyse","Hypocalcémie par diminution de l'absorption intestinale"],"ABCE","Le manque de PTH diminue l'ostéolyse (D faux) et l'absorption intestinale du calcium."],
[22,"Conséquences de l'hypocalcémie :",["Hyperexcitabilité cellulaire généralisée","Crises de tétanie","Troubles psychiques","Atteinte des dérivés ectodermiques : cristallin, peau, cheveux, dents","Hypoexcitabilité neuromusculaire"],"ABCD","L'hypoCa provoque une hyperexcitabilité (E faux)."],
[23,"Crise de tétanie typique :",["Début brutal, spontané ou après un effort (polypnée)","Siège en général aux mains","Associe signes sensitifs, moteurs et neurovégétatifs","Débute toujours aux pieds","S'accompagne d'une perte de connaissance"],"ABC","La conscience reste intacte (E faux) ; début aux mains (D faux)."],
[24,"Tétanie : signes sensitifs et moteurs :",["Premiers signes : fourmillements, picotements à la pulpe des doigts, puis vers l'avant-bras","Fasciculations visibles au 1er espace interosseux","La contracture est le signe majeur et s'étend vers le haut","Main d'accoucheur : doigts demi-fléchis rapprochés, adduction forcée du pouce","Extension des doigts en éventail"],"ABCD","Main d'accoucheur = flexion/rapprochement des doigts (E faux)."],
[25,"Tétanie : autres localisations :",["Aux pieds : plante creusée, orteils fléchis","Crise MS + pieds = spasme carpo-pédal","À la face : « museau de carpe », surtout lèvre supérieure","Contracture des muscles rachidiens plus rare","Atteinte viscérale (tube digestif, vessie) fréquente"],"ABCD","L'atteinte viscérale est exceptionnelle ou discutable (E faux)."],
[26,"Tétanie : troubles neurovégétatifs et durée :",["Agitation, angoisse, pleurs","Conscience intacte","Durée variable de quelques minutes à quelques heures","Perte de connaissance constante","Durée toujours inférieure à 1 minute"],"ABC","D et E sont contraires au cours."],
[27,"Formes cliniques de la tétanie :",["Formes mineures très fréquentes","Simple tension musculaire passagère de la main = forme mineure","Spasme respiratoire = forme grave","Crises comitiales, convulsions, syncopes = formes graves","Les formes mineures sont exceptionnelles"],"ABCD","Les formes mineures sont très fréquentes (E faux)."],
[28,"Formes particulières :",["Chez l'enfant : fréquentes, surtout convulsives","Laryngospasme : apnée, cyanose brutale puis reprise respiratoire (peut être grave)","Femme enceinte : crises typiques en début ou fin de grossesse","Formes familiales suggérant une transmission génétique","Chez l'enfant : formes exceptionnelles"],"ABCD","E contredit le cours."],
[29,"Manifestations neuropsychiques aiguës :",["Crises comitiales plus fréquentes chez l'enfant que chez l'adulte","Troubles psychiques aigus trompeurs et très variés","Troubles de l'humeur : mélancolie aiguë","Confusion, psychose hallucinatoire aiguë","Ne nécessitent aucun traitement d'urgence"],"ABCD","Elles réclament un traitement d'urgence (E faux)."],
[30,"Manifestations chroniques :",["Symptomatologie fonctionnelle relativement fréquente","Réalise sur un mode mineur les manifestations aiguës","Très peu évocatrice","Très spécifique","Toujours sévère"],"ABC","Peu évocatrice, donc d'où l'intérêt de rechercher les signes physiques."],
[31,"Devant une suspicion d'hypoparathyroïdie, deux gestes s'imposent :",["Objectiver l'hyperexcitabilité neuromusculaire","Rechercher le retentissement organique","Débuter un traitement sans examen","Réaliser d'emblée une scintigraphie au sestamibi","Réaliser une biopsie thyroïdienne"],"AB","Seuls A et B correspondent aux deux gestes décrits."],
[32,"Signe de Chvostek – technique :",["Malade de face, bouche légèrement entrouverte","Percussion avec un marteau à réflexe","Point à mi-distance entre commissure labiale et lobule de l'oreille, sous le zygoma","Percussion de la région frontale","Garrot sur le bras pendant 5 à 10 min"],"ABC","D et E : autre technique (E = Trousseau)."],
[33,"Signe de Chvostek – résultat et valeur :",["Contraction de l'orbiculaire des lèvres","Lèvres projetées en avant : museau de carpe","Évoque fortement une tétanie latente","Peut avoir d'autres origines (hypoK, neurovégétative)","Spécifique et pathognomonique de l'hypocalcémie"],"ABCD","Il n'est pas spécifique (E faux)."],
[34,"Manœuvre de Trousseau :",["Sujet allongé au repos","Garrot pneumatique (tensiomètre de Vaquez) gonflé au-dessus de la PA maximale","Ischémie maintenue 5 à 10 minutes","Crise sensitivomotrice typique : paresthésies, main d'accoucheur, parfois à la levée du garrot","Garrot gonflé sous la PA minimale"],"ABCD","Signifie toujours tétanie ; le garrot doit dépasser la PAS (E faux)."],
[35,"Signe de Lust et hyperpnée provoquée :",["Lust a la même valeur que Chvostek","Percussion de la face externe du genou, à la tête du péroné","Percussion du tendon d'Achille","Hyperpnée : respirer lentement et profondément quelques minutes","Hyperpnée provoquée : apnée prolongée"],"ABD","C et E ne figurent pas dans le cours."],
[36,"Retentissement organique de l'hypoparathyroïdie :",["Cataracte antérieure","Ongles épais, fragiles, striés, cassants, leuconychies","Cheveux fragiles, cassants, souvent alopécie","Dents striées, hypoplasie de l'émail, caries, fractures","Peau sèche, amincie, parfois candidose cutanée ou psoriasis"],"BCDE","La cataracte est postérieure (A faux)."],
[37,"Hypoparathyroïdie : radiologie et ECG :",["Densification anormale des corticales","Calcifications des noyaux gris centraux (Fahr)","Allongement de l'espace QT","Raccourcissement du QT","Ostéite fibrokystique"],"ABC","QT allongé (hypoCa) ; ostéite fibrokystique = HPP."],
[37,"Hypoparathyroïdie : biologie :",["Hypocalcémie 50 à 70 mg/L","Hypocalciurie (50 mg/24 h)","Hyperphosphorémie > 50 mg/L","Hypophosphaturie (< 300 mg/L)","Hypercalciurie"],"ABCD","Calciurie basse, phosphorémie haute (E faux)."],
["Synthèse","Espace QT :",["Raccourci dans l'HPP","Allongé dans l'hypoparathyroïdie","Allongé dans l'HPP","Raccourci dans l'hypoparathyroïdie","Toujours normal"],"AB","QT suit inversement la calcémie."],
["Synthèse","Phosphore :",["HPP : hypophosphatémie avec hyperphosphaturie","Hypoparathyroïdie : hyperphosphorémie avec hypophosphaturie","La PTH augmente la phosphaturie","Hypoparathyroïdie : hypercalciurie","Dans l'HPP, la phosphatémie n'est jamais élevée"],"ABCE","Hypoparathyroïdie : hypocalciurie (D faux)."],
["Synthèse","Calcium :",["HPP : hypercalciurie passive","Hypoparathyroïdie : hypocalciurie","La PTH augmente la réabsorption tubulaire du calcium","Hypoparathyroïdie : diminution de l'ostéolyse","Hypoparathyroïdie : augmentation de l'absorption intestinale du Ca"],"ABCD","L'absorption intestinale diminue en hypoparathyroïdie (E faux)."],
["Synthèse","Signes d'hyperexcitabilité neuromusculaire recherchés :",["Chvostek","Trousseau","Lust","Hyperpnée provoquée","Recklinghausen"],"ABCD","Recklinghausen désigne l'ostéite fibrokystique (HPP)."]
];
const L="ABCDE";let last=null,app=document.getElementById("app");
Q.forEach((q,i)=>{if(q[0]!==last){last=q[0];app.insertAdjacentHTML("beforeend",`<div class="pg">${typeof last==="number"?"Page "+last:last}</div>`)}
let h=`<div class="q" id="q${i}"><div class="st">${i+1}. ${q[1]}</div>`;
q[2].forEach((o,j)=>h+=`<label class="o"><input type="checkbox" value="${L[j]}"><span><b>${L[j]}.</b> ${o}</span></label>`);
h+=`<button onclick="chk(${i})">Corriger</button><div class="ex"></div></div>`;app.insertAdjacentHTML("beforeend",h)});
const done={};
function chk(i){const q=Q[i],box=document.getElementById("q"+i),ls=[...box.querySelectorAll(".o")];let ok=true;
ls.forEach((l,j)=>{const c=l.querySelector("input"),good=q[3].includes(L[j]);c.disabled=true;l.classList.remove("ok","ko","mis");
if(good&&c.checked)l.classList.add("ok");else if(good){l.classList.add("mis");ok=false}else if(c.checked){l.classList.add("ko");ok=false}});
const e=box.querySelector(".ex");e.style.display="block";e.innerHTML=`<b>Réponse : ${q[3].split("").join(", ")}</b> – ${q[4]}`;box.querySelector("button").style.display="none";done[i]=ok;sc()}
function all_(){Q.forEach((_,i)=>{if(!(i in done))chk(i)})}
function sc(){const n=Object.keys(done).length,s=Object.values(done).filter(Boolean).length;document.getElementById("sc").textContent=`Score : ${s}/${n} (sur ${Q.length})`}
</script>
</body>
</html>
