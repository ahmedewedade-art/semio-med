<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QCM – Syndrome neurogène périphérique</title>
<style>
:root{--bg:#f6f7f9;--c:#fff;--t:#1d2430;--m:#5b6678;--b:#d6dbe3;--ok:#1b8a4b;--ko:#c0392b;--ac:#2f5fd0;--okb:#e5f6ec;--kob:#fdebe8}
@media(prefers-color-scheme:dark){:root{--bg:#14171c;--c:#1d2128;--t:#e8ebf0;--m:#9aa5b5;--b:#333a45;--ok:#4cc27f;--ko:#ef6f60;--ac:#7da2ff;--okb:#17382a;--kob:#40201c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.5 system-ui,sans-serif;padding:12px;max-width:820px;margin:auto}
h1{font-size:1.3rem}.sub{color:var(--m);font-size:.9rem}
.q{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin:14px 0}
.pg{font-size:.75rem;color:var(--ac);font-weight:600}.st{font-weight:600;margin:4px 0 8px}
label{display:flex;gap:8px;align-items:flex-start;padding:7px 8px;border:1px solid var(--b);border-radius:8px;margin:5px 0;cursor:pointer}
label.ok{background:var(--okb);border-color:var(--ok)}label.ko{background:var(--kob);border-color:var(--ko)}
label.miss{border-style:dashed;border-color:var(--ok)}
input{margin-top:4px}button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:.95rem;cursor:pointer;margin-top:6px}
.ex{display:none;margin-top:8px;padding:8px 10px;border-left:4px solid var(--ac);background:var(--bg);font-size:.9rem}
.bar{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#sc{font-weight:700}.sec{font-size:.85rem;color:var(--m);margin-top:20px;font-weight:700}
</style></head><body>
<h1>QCM difficiles (33) – Syndrome neurogène périphérique</h1>
<div class="sub">Pr Moulaye Abderrahmane – DCEM1 · Chaque question : 5 propositions (A–E), une ou plusieurs réponses exactes. Question juste = toutes les bonnes propositions cochées et aucune fausse.</div>
<div class="bar"><span id="sc">Score : 0/0</span><button onclick="all_()">Tout corriger</button><button onclick="location.reload()">Recommencer</button></div>
<div id="app"></div>
<script>
const Q=[{"p":"2","q":"Définition et intérêt du syndrome neurogène périphérique :","o":["Ensemble de manifestations cliniques, biologiques, électriques et histologiques","Résulte d’une atteinte du neurone périphérique","À reconnaître surtout devant un déficit moteur proximal","Intérêt : déficit moteur distal associé à des troubles de la sensibilité","Définition limitée aux signes cliniques et électriques"],"a":"ABD","e":"C faux : déficit surtout DISTAL. E faux : manifestations aussi biologiques et histologiques."},
{"p":"3","q":"Objectifs du cours :","o":["Décrire les signes cliniques du SNP","Donner les examens complémentaires confortant le diagnostic","Donner le diagnostic différentiel","Décrire le syndrome de Guillain-Barré et citer les étiologies","Donner le traitement du SNP"],"a":"ABCD","e":"E faux : le traitement ne fait pas partie des objectifs."},
{"p":"4","q":"Rappel anatomique :","o":["Fibres motrices : corne antérieure de la moelle","Fibres sensitives : ganglion de la chaîne sympathique","Fibres végétatives : ganglions sympathique et parasympathique","Tissu de soutien : vaisseaux et tissu conjonctif","Lésions élémentaires : myéliniques, axonales ou myélino-axonales"],"a":"ACDE","e":"B faux : sensitives = ganglion rachidien."},
{"p":"6","q":"Cotation musculaire de 0 à 5 :","o":["0 : pas de contraction","1 : contraction faible avec déplacement","2 : déplacement faible si pesanteur éliminée","3 : déplacement possible contre la pesanteur","4 : déplacement possible contre la résistance"],"a":"ACDE","e":"B faux : 1 = contraction faible SANS déplacement."},
{"p":"6-7","q":"Déficit moteur et tonus :","o":["Diminution de la force segmentaire","Para/tétraparésie ou para/tétraplégie possibles","Prédominance proximale","Hypotonie : diminution du tonus musculaire, paralysie flasque","Hypotonie : augmentation du tonus musculaire"],"a":"ABD","e":"C faux : prédominance distale. E faux : hypotonie = diminution."},
{"p":"7","q":"Amyotrophie :","o":["Conséquence de la dénervation","Plus ou moins marquée selon le nombre de fibres détruites","Importante dans les atteintes démyélinisantes","Importante dans les atteintes axonales","Modérée dans les atteintes démyélinisantes"],"a":"ABDE","e":"C faux : modérée dans les démyélinisantes."},
{"p":"8","q":"Crampes, fasciculations, ROT :","o":["Crampes : contractures douloureuses","Fasciculations : grande valeur sémiologique","Fasciculations : visibles à jour frisant","Fasciculations : toujours spontanées","ROT diminués ou abolis"],"a":"ABCE","e":"D faux : spontanées ou provoquées (percussion, froid)."},
{"p":"9","q":"Signes sensitifs subjectifs :","o":["Souvent les premiers à apparaître","Origine radiculaire ou tronculaire","Paresthésies : fourmillements, picotements, brûlures, engourdissements, décharges électriques","Dysesthésies : sensations spontanées sans stimulus","Les douleurs sont des signes objectifs"],"a":"ABC","e":"D faux : dysesthésies déclenchées par le tact. E faux : douleurs = signes subjectifs."},
{"p":"10","q":"Signes sensitifs objectifs :","o":["Discrets ou absents","Sensibilité superficielle : tactile, thermique, algique","Sensibilité profonde : sens vibratoire, sens de position, ataxie","Sens vibratoire : sensibilité superficielle","Toujours francs et au premier plan"],"a":"ABC","e":"D faux : vibratoire = profonde. E faux : discrets ou absents."},
{"p":"10","q":"Signes neurovégétatifs :","o":["Troubles vasomoteurs : œdème, cyanose","Troubles trophiques : œdème, cyanose","Troubles des phanères : chute de poils, ongles cassants","Hypotension artérielle, impuissance, incontinence urinaire","Hypertension artérielle"],"a":"ACD","e":"B faux : trophiques = peau sèche, squameuse, atrophique. E faux : hypotension."},
{"p":"11","q":"Électromyogramme :","o":["Repos : activité spontanée (potentiels de fibrillation)","Contraction : tracé pauvre en potentiels d’unités motrices","Indication topographique : radiculaire, tronculaire ou diffuse","Confirme l’absence de signes myogènes","Contraction : tracé riche"],"a":"ABCD","e":"E faux : tracé pauvre, la richesse exagérée est myogène."},
{"p":"12","q":"Vitesses de conduction nerveuse :","o":["Démyélinisante : ralentissement diffus des VCM et VCS","Axonale : VCN normales, baisse d’amplitude motrice et sensitive","Axonale : ralentissement diffus","Démyélinisante : VCN normales","Démyélinisante : ralentissement des seules VCM"],"a":"AB","e":"C, D, E faux : profils inversés ou incomplets."},
{"p":"12","q":"Étude du LCR :","o":["Ponction lombaire","LCR normal ou hyperprotéinorrachie","Dissociation albumino-cytologique : en faveur d’une atteinte inflammatoire","Dissociation albumino-cytologique : hypercytose","LCR toujours anormal"],"a":"ABC","e":"D faux : protéines élevées sans réaction cellulaire. E faux : le LCR peut être normal."},
{"p":"13","q":"Biopsie neuromusculaire :","o":["Confirme le diagnostic","Confirme le caractère de la neuropathie","Démyélinisation segmentaire","Dégénérescence axonale","Étudie les potentiels de fibrillation"],"a":"ABCD","e":"E faux : c’est l’EMG."},
{"p":"14","q":"Syndrome pyramidal :","o":["Mono, hémi, para ou tétraplégie","Fasciculations présentes","Pas d’amyotrophie","ROT vifs, exagérés","EMG : richesse du tracé en rapport avec l’effort"],"a":"ACDE","e":"B faux : pas de fasciculations."},
{"p":"15","q":"Syndrome myogène :","o":["Déficit moteur proximal","Fasciculations présentes","Amyotrophie présente","ROT normaux, pas de troubles sensitifs","CPK et LDH élevées"],"a":"ACDE","e":"B faux : pas de fasciculations."},
{"p":"16","q":"Syndrome monoradiculaire (sciatique L5 ou S1) :","o":["Exemple : sciatique L5 ou S1","Signe majeur : déficit moteur systématisé","Trajet : du rachis vers le territoire de la racine","Déclenché par toux, éternuement (pression du LCR)","Le signe de Lasègue étire la racine"],"a":"ACDE","e":"B faux : signe majeur = douleur."},
{"p":"17","q":"Syndrome de la queue de cheval :","o":["Racines lombaires et sacrées de L2 à S5","Douleurs polyradiculaires","Paraplégie flasque","Anesthésie en selle","ROT vifs"],"a":"ABCD","e":"E faux : ROT abolis, avec troubles sphinctériens."},
{"p":"17","q":"Syndromes tronculaires :","o":["Atteinte isolée d’un tronc nerveux","Signe majeur : déficit moteur de topographie systématisée","Amyotrophie selon le degré de dénervation","Signe majeur : douleur","Concernent toujours plusieurs troncs"],"a":"ABC","e":"D faux : le signe majeur est le déficit moteur. E faux : atteinte ISOLÉE."},
{"p":"18","q":"Syndromes tronculaires, signes sensitifs :","o":["Déficit sensitif de toutes les modalités","Paresthésies fréquentes, douleurs rares","Douleurs fréquentes","Déficit limité à la douleur","Paresthésies dans le territoire du nerf"],"a":"ABE","e":"C et D faux."},
{"p":"18","q":"Principales atteintes tronculaires :","o":["Médian : canal carpien","Cubital : gouttière humérale","Radial : gouttière humérale","SPE : col du péroné","Médian : canal carpien (au poignet)"],"a":"ACDE","e":"B faux : cubital = coude."},
{"p":"19","q":"Polyneuropathies :","o":["Sensitivomotrices distales symétriques","Début : douleurs, crampes, paresthésies","Plus tard : déficit en gants et chaussettes, toutes modalités","ROT conservés","Troubles trophiques et vasomoteurs"],"a":"ABCE","e":"D faux : ROT abolis."},
{"p":"20","q":"Multinévrites et polyradiculonévrites :","o":["Multinévrite : sensitivomotrice distale asymétrique","Atteintes successives de plusieurs troncs, non systématisées","Multinévrite : atteinte symétrique","Polyradiculonévrite : atteinte proximo-distale","Forme aiguë : syndrome de Guillain-Barré"],"a":"ABDE","e":"C faux : asymétrique."},
{"p":"20","q":"Guillain-Barré, début :","o":["Déficit sensitivomoteur des 4 membres en quelques jours","Proximal et distal","Installation descendante","Précédé d’un syndrome grippal","Installation en plusieurs mois"],"a":"ABD","e":"C faux : ascendante. E faux : quelques jours."},
{"p":"21","q":"Guillain-Barré, extension :","o":["Paralysie faciale bilatérale","Atteinte des oculomoteurs","Atteinte de la déglutition","Atteinte respiratoire : pronostic vital immédiat","Tous les ROT conservés"],"a":"ABCD","e":"E faux : tous abolis."},
{"p":"21","q":"Guillain-Barré, LCR et évolution :","o":["Tous les ROT sont abolis","LCR : dissociation albumino-cytologique","Récupération rapide dans 20 % des cas","Complications dans 80 % des cas","Forme chronique : même symptomatologie, évolution plus longue"],"a":"ABE","e":"C et D faux : 80 % de récupération rapide, 20 % de complications."},
{"p":"22","q":"Étiologies carentielles :","o":["B1 : alcool","B6 : isoniazide","B12 : anémie de Biermer","B6 : alcool","Grossesse : neuropathie gravidique ou gravido-carentielle"],"a":"ABCE","e":"D faux : alcool = B1."},
{"p":"22","q":"Diabète et toxiques :","o":["Neuropathie diabétique","Métaux lourds : plomb, arsenic","Médicaments : cisplatine, phénytoïne","Cisplatine : métal lourd","Isoniazide : carence en B12"],"a":"ABC","e":"D faux : médicament. E faux : B6."},
{"p":"23","q":"Maladies systémiques et héréditaires :","o":["Périartérite noueuse","Polyarthrite rhumatoïde","Lupus érythémateux disséminé","Sarcoïdose : maladie héréditaire","Charcot-Marie-Tooth : maladie héréditaire"],"a":"ABCE","e":"D faux : la sarcoïdose est une maladie systémique."},
{"p":"11-15","q":"Associer signe et syndrome :","o":["Fasciculations : syndrome neurogène périphérique","ROT vifs : syndrome pyramidal","CPK élevées : syndrome myogène","Déficit proximal : syndrome myogène","Déficit distal avec troubles sensitifs : syndrome myogène"],"a":"ABCD","e":"E faux : évoque un SNP."},
{"p":"7, 12","q":"P1 : amyotrophie modérée, VCN ralenties diffusément. P2 : amyotrophie sévère, VCN normales, amplitudes basses.","o":["P1 : démyélinisante","P2 : axonale","L’amyotrophie reflète le nombre de fibres détruites","P2 : VCN ralenties","L’amyotrophie sévère oriente vers une lésion myélinique"],"a":"ABC","e":"D faux : VCN normales. E faux : axonale."},
{"p":"16-20","q":"Associer topographie et tableau :","o":["Queue de cheval : paraplégie flasque, anesthésie en selle","Polyneuropathie : gants et chaussettes","Multinévrite : atteintes successives asymétriques","Radiculaire : douleur à trajet de racine, déclenchée par la toux","Polyradiculonévrite : atteinte distale symétrique pure"],"a":"ABCD","e":"E faux : atteinte proximo-distale (racines et extrémités)."},
{"p":"19, 22","q":"Alcoolique : déficit distal douloureux symétrique, amyotrophie, ROT abolis, paresthésies en chaussettes.","o":["Étiologie carentielle (B1)","Déficit en chaussettes, toutes modalités","Syndrome myogène","Les troubles sensitifs et le caractère distal éliminent un myogène","Atteinte isolée du SPE"],"a":"ABD","e":"C faux : myogène = proximal, sans trouble sensitif. E faux : tableau symétrique diffus."}];
const L="ABCDE",app=document.getElementById("app");let done={},score=0;
Q.forEach((x,i)=>{const d=document.createElement("div");d.className="q";d.id="q"+i;
d.innerHTML=`<div class="pg">Q${i+1} · ${x.p=="Hors cours"?"hors cours":"page "+x.p}</div><div class="st">${x.q}</div>`+x.o.map((t,j)=>`<label><input type="checkbox" value="${L[j]}"><span><b>${L[j]}.</b> ${t}</span></label>`).join("")+`<button onclick="chk(${i})">Valider</button><div class="ex" id="e${i}"></div>`;app.appendChild(d)});
function chk(i){if(done[i])return;done[i]=1;const d=document.getElementById("q"+i),x=Q[i];let s="";
d.querySelectorAll("label").forEach((l,j)=>{const c=l.querySelector("input"),r=x.a.includes(L[j]);if(c.checked)s+=L[j];c.disabled=true;
if(c.checked&&r)l.classList.add("ok");else if(c.checked&&!r)l.classList.add("ko");else if(r)l.classList.add("miss")});
const good=s===x.a;if(good)score++;const e=document.getElementById("e"+i);e.style.display="block";
e.innerHTML=`<b style="color:var(${good?"--ok":"--ko"})">${good?"✔ Juste":"✘ Faux"}</b> — Réponses : <b>${x.a.split("").join(", ")}</b><br>${x.e}`;
d.querySelector("button").style.display="none";document.getElementById("sc").textContent=`Score : ${score}/${Object.keys(done).length} (sur ${Q.length})`}
function all_(){Q.forEach((_,i)=>chk(i))}
</script></body></html>
