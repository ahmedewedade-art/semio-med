<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QCM – Examen du nourrisson et de l’enfant</title>
<style>
:root{--bg:#f6f7f9;--c:#fff;--t:#1a1d21;--m:#5c6670;--b:#d8dde3;--ok:#1b8a4b;--okb:#e3f5ea;--ko:#c0392b;--kob:#fbe5e2;--ms:#b9770e;--msb:#fdf1dc;--ac:#2456c7}
@media(prefers-color-scheme:dark){:root{--bg:#14171b;--c:#1d2127;--t:#e8eaed;--m:#9aa4af;--b:#333a43;--ok:#4cc783;--okb:#17301f;--ko:#f07a6c;--kob:#37201d;--ms:#e8b04a;--msb:#34290f;--ac:#7aa2ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.5 system-ui,sans-serif;padding:12px;max-width:820px;margin:auto}
h1{font-size:1.3rem;margin:8px 0}.bar{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid var(--b)}
select,button{font:inherit;padding:8px 12px;border-radius:8px;border:1px solid var(--b);background:var(--c);color:var(--t)}button{cursor:pointer;background:var(--ac);color:#fff;border:0}button.g{background:var(--c);color:var(--t);border:1px solid var(--b)}
#sc{margin-left:auto;font-weight:600}
.q{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin:14px 0}
.tag{font-size:.75rem;color:var(--m);text-transform:uppercase;letter-spacing:.04em}
.q h3{font-size:1rem;margin:4px 0 10px}
.o{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--b);border-radius:8px;margin:6px 0;cursor:pointer}
.o input{margin-top:5px}.o.ok{background:var(--okb);border-color:var(--ok)}.o.ko{background:var(--kob);border-color:var(--ko)}.o.ms{background:var(--msb);border-color:var(--ms)}
.e{display:none;margin-top:10px;padding:10px;border-left:4px solid var(--ac);background:var(--bg);border-radius:6px;font-size:.93rem}
.r{font-weight:600;margin-top:8px}
</style></head><body>
<h1>QCM difficile – Examen du nourrisson et de l’enfant</h1>
<div class="bar"><select id="f"></select><button onclick="allv()">Tout valider</button><button class="g" onclick="rs()">Recommencer</button><span id="sc"></span></div>
<div id="L"></div>
<script>
// [diapo, énoncé, [A,B,C,D,E], bonnes réponses, justification]
const Q=[
[2,'Règles basiques de l’examen pédiatrique : quelles propositions sont exactes ?',['Mettre l’enfant et sa famille en confiance','Éliminer les situations de détresse vitale','Les parents sont la source principale de renseignements dans la majorité des cas','L’enfant n’est pas un interlocuteur : seuls les parents répondent','La symptomatologie est appréciée comme chez l’adulte'],'ABC','A, B, C conformes au cours. D faux : l’enfant est un interlocuteur à part entière. E faux : la symptomatologie est appréciée pour un organisme en développement.'],
[2,'À propos des règles basiques :',['L’enfant doit être un interlocuteur à part entière','La symptomatologie est appréciée pour un organisme en développement','La détresse vitale est recherchée après l’examen complet','Les parents sont l’unique source de renseignements','Les parents restent la source principale de renseignements dans la majorité des cas'],'ABE','A, B, E exacts. C faux : on élimine d’emblée une détresse vitale. D faux : « principale dans la majorité des cas » ≠ « unique ».'],
[4,'Motif de consultation – conduite de l’analyse :',['Description précise des symptômes évoqués','Symptômes analysés globalement, sans distinction d’appareil','Analyse appareil par appareil','Recherche des modifications du comportement','Analyse de l’alimentation et de l’appétit'],'ACDE','B faux : l’analyse est faite appareil par appareil. Les autres sont des éléments du cours.'],
[4,'Éléments à explorer dans le motif de consultation :',['Troubles de déglutition','Vomissements','Aspect et fréquence des selles','Rang dans la fratrie','Vaccinations'],'ABC','A, B, C = motif de consultation. D et E appartiennent aux antécédents.'],
[5,'Contexte socio-familial (rubrique des antécédents) :',['Rang dans la fratrie','Conditions matérielles de vie à la maison','Activité professionnelle des parents','Consanguinité','Décès dans la fratrie'],'ABC','A, B, C sont les sous-rubriques du contexte socio-familial. D et E sont des items distincts des antécédents.'],
[5,'Autres items des antécédents cités dans le cours :',['Passé médico-chirurgical des parents et de la fratrie','Consanguinité','Décès dans la fratrie','Maladie intrafamiliale','Résultats de l’imagerie de l’enfant'],'ABCD','A–D cités. E n’est pas un antécédent : relève des examens complémentaires.'],
[5,'Antécédents – autres rubriques :',['Déroulement de la grossesse et de l’accouchement','Antécédents personnels','Vaccinations','Le rang dans la fratrie relève des antécédents personnels','Le motif de consultation fait partie des antécédents'],'ABC','D faux : le rang dans la fratrie relève du contexte socio-familial. E faux : le motif est une rubrique à part de l’anamnèse.'],
[7,'Règles méthodiques d’examen :',['Environnement et cadre favorables','Enfant mis en confiance','Enfant entièrement dévêtu','Aller de l’invasif vers l’anodin','Réserver les manœuvres désagréables ou douloureuses pour la fin'],'ABCE','D inversé : on va du simple au compliqué, de l’anodin à l’invasif.'],
[7,'Ordre de l’examen :',['Du simple au compliqué','De l’anodin à l’invasif','Manœuvres douloureuses d’emblée pour gagner du temps','Examen sur enfant habillé pour ne pas l’inquiéter','Manœuvres potentiellement douloureuses réservées pour la fin'],'ABE','C inversé. D faux : l’enfant doit être entièrement dévêtu.'],
[8,'Inspection – éléments recherchés :',['Etat de conscience','Motilité spontanée','Attitudes vicieuses : cyphose, torticolis, déformation d’un membre','Tonus, vivacité','Poids et périmètre crânien'],'ABCD','E = mesures de base, pas inspection.'],
[8,'Inspection – coloration et aspect :',['Cyanose, pâleur, ictère, éruption : coloration de la peau et des lèvres','Une dysmorphie est recherchée','La cyphose est une attitude vicieuse','Le torticolis est une attitude vicieuse','Le périmètre crânien fait partie de l’inspection'],'ABCD','E faux : mesure de base.'],
[9,'Mesures de base :',['Poids, taille et périmètre crânien reportés sur la courbe de croissance','Température corporelle','Pression artérielle','Auscultation cardiaque','Électrocardiogramme'],'ABC','D appartient à l’examen cardiovasculaire (systématique). E = autre examen.'],
[9,'À propos des mesures de base :',['Poids, taille et PC sont reportés sur la courbe de croissance','Seul le poids est reporté sur la courbe','La pression artérielle en fait partie','La température corporelle en fait partie','Elles sont facultatives'],'ACD','B faux (poids, taille ET PC). E faux : ce sont des mesures de base.'],
[10,'Examen systématique (1) :',['Peau et aires ganglionnaires','Tête et cou','Système respiratoire','Examen cardiovasculaire','Examen gynécologique systématique'],'ABCD','E non cité dans le cours.'],
[10,'Examen systématique (2) :',['Examen de l’abdomen','Examen neuromusculaire et orthopédique','Évaluation du développement psychomoteur','Évaluation de la douleur','Fond d’œil systématique'],'ABCD','E non cité.'],
[11,'Conclusion de la consultation :',['La synthèse de l’interrogatoire et de l’examen clinique = diagnostic','Une analyse sémiologique rigoureuse et exhaustive classe les hypothèses par vraisemblance','Elle justifie d’éventuels examens complémentaires','La synthèse est transcrite dans le carnet de santé ou le dossier d’observation si hospitalisé','Le diagnostic repose d’abord sur les examens complémentaires'],'ABCD','E faux : le diagnostic vient de la clinique (interrogatoire + examen).'],
[11,'Transcription et classement des hypothèses :',['Synthèse notée dans le carnet de santé','Dossier d’observation si l’enfant est hospitalisé','Hypothèses classées par ordre alphabétique','Examens complémentaires demandés avant l’analyse sémiologique','Synthèse uniquement orale'],'AB','C faux (ordre de vraisemblance). D faux (la réflexion précède). E faux (transcrite).'],
[13,'Bon usage des examens complémentaires :',['Ils ne sont que le complément de l’examen clinique','On doit se demander : qu’attend-on de cet examen ?','La réflexion précède la demande','La consultation est l’acte médical par excellence','Ils précèdent la consultation'],'ABCD','E faux : l’examen complémentaire ne vient qu’après la consultation.'],
[13,'Principes complémentaires :',['La réflexion suit la demande d’examen','L’examen complémentaire remplace l’examen clinique','Il ne vient qu’après la consultation','On doit toujours savoir ce qu’on attend de l’examen','Il n’est que le complément de l’examen clinique'],'CDE','A inversé. B faux : il ne remplace pas la clinique.'],
[14,'Les trois bons motifs de demander un examen complémentaire :',['Établir le diagnostic ou du moins les orientations diagnostiques','Porter un pronostic ou identifier une complication changeant l’attitude thérapeutique','Surveiller l’efficacité thérapeutique si l’évolution l’exige','Rassurer les parents','Par habitude, de façon systématique'],'ABC','D et E ne sont pas des motifs retenus.'],
[14,'Un examen complémentaire est justifié si :',['Il identifie une complication impliquant une attitude thérapeutique différente','L’évolution nécessite de surveiller l’efficacité du traitement','Il est demandé avant tout examen clinique','Il permet d’établir au moins une orientation diagnostique','Il est réalisé systématiquement chez tout enfant'],'ABD','C et E contraires au cours.'],
[15,'Examens complémentaires en pédiatrie quotidienne :',['Pas d’examen systématique','Toujours orientés par la synthèse de l’examen clinique','Bilan systématique à chaque consultation','Bilan de routine chez tout nourrisson','Guidés par l’examen clinique'],'ABE','C et D faux : pas d’examen systématique.'],
[16,'Prélèvements biologiques cités :',['Sang','Urines','Selles','Liquide céphalorachidien','Scintigraphie'],'ABCD','E = imagerie, pas un prélèvement.'],
[16,'Autres prélèvements :',['Liquide pleural','Ascite','Salive, crachat','Biopsie (prélèvement de tissu, ex. anapath)','Le LCR est classé dans « autres liquides »'],'ABCD','E faux : le LCR est cité séparément. (A, B, C = autres liquides ; D = tissu.)'],
[17,'Imagerie médicale citée :',['Radiographie conventionnelle','Échographie','Tomodensitométrie (scanner)','IRM','Électro-encéphalogramme'],'ABCD','E = « autre examen », pas imagerie.'],
[17,'Imagerie – identification :',['Scintigraphie','IRM = imagerie par résonance magnétique','TDM = scanner','EEG','Fibroscopie'],'ABC','D et E sont classés dans « autres examens ».'],
[18,'Autres examens cités :',['Électro-encéphalogramme','Électromyogramme','Électrocardiogramme','Audiogramme','Scintigraphie'],'ABCD','E = imagerie.'],
[18,'Autres examens (suite) :',['Tympanogramme','Tests psychométriques','Tests orthophoniques','Fibroscopie (explorations digestives)','Biopsie'],'ABCD','E = prélèvement de tissu, pas dans « autres examens ».'],
[18,'Lesquels sont des « autres examens » et NON de l’imagerie ?',['Électro-encéphalogramme','Échographie','Électromyogramme','Scanner','Audiogramme'],'ACE','B et D = imagerie.']
];
const L=document.getElementById('L'),F=document.getElementById('f'),S=document.getElementById('sc');
const pages=[...new Set(Q.map(q=>q[0]))];
F.innerHTML='<option value="0">Toutes les pages du cours</option>'+pages.map(p=>`<option value="${p}">Diapo ${p}</option>`).join('');
F.onchange=()=>{document.querySelectorAll('.q').forEach(e=>e.style.display=(F.value==0||e.dataset.p==F.value)?'':'none')};
const done={};
Q.forEach((q,i)=>{const d=document.createElement('div');d.className='q';d.dataset.p=q[0];
d.innerHTML=`<div class="tag">Diapo ${q[0]} · Q${i+1}</div><h3>${q[1]} <small>(plusieurs réponses possibles)</small></h3>`+
q[2].map((t,j)=>`<label class="o" data-l="${'ABCDE'[j]}"><input type="checkbox" value="${'ABCDE'[j]}"><span><b>${'ABCDE'[j]}.</b> ${t}</span></label>`).join('')+
`<button onclick="v(${i})">Valider</button><div class="r"></div><div class="e"><b>Justification :</b> ${q[4]}<br><b>Réponse(s) :</b> ${q[3].split('').join(', ')}</div>`;L.appendChild(d)});
function v(i){const d=L.children[i],q=Q[i];if(done[i]!==undefined)return;
const sel=[...d.querySelectorAll('input:checked')].map(x=>x.value).join('');
d.querySelectorAll('.o').forEach(o=>{const l=o.dataset.l,c=q[3].includes(l),s=sel.includes(l);o.querySelector('input').disabled=true;
if(c&&s)o.classList.add('ok');else if(!c&&s)o.classList.add('ko');else if(c)o.classList.add('ms')});
const ok=sel===q[3];done[i]=ok;d.querySelector('.r').textContent=ok?'✔ Correct':'✘ Incorrect';d.querySelector('.r').style.color=ok?'var(--ok)':'var(--ko)';
d.querySelector('.e').style.display='block';d.querySelector('button').style.display='none';sc()}
function sc(){const n=Object.keys(done).length,g=Object.values(done).filter(Boolean).length;S.textContent=`Score : ${g}/${n} (sur ${Q.length})`}
function allv(){Q.forEach((_,i)=>v(i))}
function rs(){location.reload()}
sc();
</script></body></html>
