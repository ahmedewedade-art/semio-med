<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz ECG pathologique – 30 QCM</title>
<style>
:root{--bg:#f6f7fb;--c:#fff;--t:#1d2433;--m:#5d6679;--b:#d5d9e4;--p:#b3213a;--ok:#17803d;--okb:#dff5e6;--ko:#c0262d;--kob:#fde3e3;--ms:#a76b00;--msb:#fff1d6}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--c:#1c212b;--t:#e8ebf2;--m:#9aa3b5;--b:#343b4a;--p:#ff6b81;--ok:#5fd68a;--okb:#16301f;--ko:#ff7b80;--kob:#3a1c1e;--ms:#ffc15a;--msb:#3a2d12}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.45 system-ui,sans-serif;padding:12px;max-width:760px;margin:auto}
h1{font-size:1.3rem;color:var(--p);margin:8px 0}.sub{color:var(--m);font-size:.9rem}
.bar{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5;font-weight:600;border-bottom:1px solid var(--b)}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin:14px 0}
.card h3{margin:0 0 8px;font-size:1rem}.card h3 span{color:var(--p)}
.o{display:block;width:100%;text-align:left;background:transparent;color:var(--t);border:1px solid var(--b);border-radius:8px;padding:9px 10px;margin:6px 0;font:inherit;cursor:pointer}
.o b{display:inline-block;width:1.5em;color:var(--p)}
.o.sel{border-color:var(--p);box-shadow:inset 0 0 0 1px var(--p)}
.o.ok{background:var(--okb);border-color:var(--ok)}.o.ko{background:var(--kob);border-color:var(--ko)}.o.ms{background:var(--msb);border-color:var(--ms)}
.v{padding:9px 16px;border:0;border-radius:8px;background:var(--p);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.v:disabled{opacity:.4}.e{display:none;margin-top:10px;padding:10px;border-left:4px solid var(--p);background:var(--bg);font-size:.93rem}
.leg{font-size:.82rem;color:var(--m)}
</style></head><body>
<h1>Quiz ECG pathologique – 30 QCM (très difficile)</h1>
<div class="sub">Une ou plusieurs réponses justes par question (A à E). Question réussie = toutes les bonnes réponses cochées et aucune fausse.</div>
<div class="bar">Score : <span id="sc">0</span> / 30 · Répondues : <span id="an">0</span></div>
<div class="leg">Vert = juste · Rouge = fausse cochée · Orange = bonne réponse oubliée</div>
<div id="app"></div>
<button class="v" onclick="location.reload()" style="margin:16px 0">Recommencer</button>
<script>
const Q=[
{q:"Morphologie de l’onde P (durée normale : 10/100 s). Propositions exactes :",o:["HAD : amplitude augmentée, durée normale","HAG : durée augmentée, double bosse, amplitude normale","HAD : amplitude maximale en DII, DIII, VF, V1","HAG : s’observe en DI, DII, VL, V1","HAG : amplitude augmentée avec durée normale"],a:"ABCD",e:"La P normale = somme OD (1re moitié) + OG (2e moitié). HAD = ↑ amplitude (durée normale) ; HAG = ↑ durée (retard de l’OG, double bosse) avec amplitude normale. E mélange HAD et HAG."},
{q:"Hypertrophies auriculaires : quelles propositions sont exactes ?",o:["HAD : P triangulaire, positive, « en tente »","HAD : durée de P augmentée","HAG : P bifide, à double sommet ou en plateau","HAG : amplitude normale, durée augmentée","En V1, l’HAD donne une P pointue positive et l’HAG une P à composante négative (biphasique)"],a:"ACDE",e:"B faux : dans l’HAD la durée est normale (seule l’amplitude augmente). En V1 la composante terminale négative traduit le retard de l’OG."},
{q:"Hypertrophie ventriculaire gauche (HVG) :",o:["Déviation axiale gauche","Onde R ample en V1, V2","Indice de Sokolov > 35 mm (SV1 + RV5/V6)","Indice de Heller-Blondeau > 40 mm","Indice de Lewis < −14 mm"],a:"ACD",e:"HVG : S profonde V1-V2 et R ample V5-V6 (B inversé : c’est l’HVD). Lewis > +18 mm pour l’HVG ; < −14 mm pour l’HVD."},
{q:"Hypertrophie ventriculaire droite (HVD) :",o:["Déviation axiale droite","R/S > 1 en V1","Onde S profonde en V5, V6","Onde R ample en V1, V2","Indice de Lewis > +18 mm"],a:"ABCD",e:"HVD : axe droit, R/S > 1, grande R en V1-V2, S profonde V5-V6, Lewis < −14 mm. E correspond à l’HVG."},
{q:"Indice de Lewis = (RI + SIII) − (RIII + SI). Propositions exactes :",o:["> +18 mm : en faveur d’une HVG","< −14 mm : en faveur d’une HVD","Une valeur comprise entre −14 et +18 mm n’est pas en faveur d’une hypertrophie","Une valeur très positive est cohérente avec une déviation axiale droite","Il se calcule à partir de V1 et V5"],a:"ABC",e:"Lewis explore l’axe dans le plan frontal (dérivations des membres) : positif = axe gauche, négatif = axe droit. D et E faux (V1/V5 = Sokolov)."},
{q:"ECG : axe −40°, SV1 = 20 mm, RV5 = 24 mm, R/S < 1 en V1. Quelles propositions sont justes ?",o:["Sokolov = 44 mm, supérieur à 35 mm","Le tracé évoque une HVG","Le tracé évoque une HVD car S profonde en V1","L’axe gauche est cohérent avec ce diagnostic","Lewis probablement < −14 mm"],a:"ABD",e:"SV1 + RV5 = 44 mm > 35 : HVG. Une S profonde en V1 est un signe d’HVG (C faux). Axe gauche ⇒ Lewis positif (E faux)."},
{q:"ECG : axe +120°, R/S = 1,5 en V1, S profonde en V6. Quelles propositions sont justes ?",o:["Hypertrophie ventriculaire droite","Lewis probablement < −14 mm","Sokolov > 35 mm attendu","Déviation axiale droite","Hypertrophie auriculaire gauche pure"],a:"ABD",e:"Axe droit + R/S > 1 + S profonde V5-V6 = HVD. Un Sokolov élevé oriente vers l’HVG. Rien ne permet de parler d’HAG."},
{q:"Insuffisance coronarienne – ischémie :",o:["Correspond à une modification de l’onde T","T symétrique à sommet pointu","Ischémie sous-épicardique : T négative","Ischémie sous-endocardique : T positive","Correspond à un décalage du segment ST"],a:"ABCD",e:"Ischémie = onde T ; lésion = segment ST ; nécrose = onde Q. E est la définition de la lésion."},
{q:"Insuffisance coronarienne – lésion :",o:["Décalage du segment ST","Sus-décalage : lésion sous-épicardique","Sous-décalage : lésion sous-endocardique","Sus-décalage : lésion sous-endocardique","Le décalage est mesuré par rapport à la ligne isoélectrique"],a:"ABCE",e:"D inversé : sus-décalage = sous-épicardique, sous-décalage = sous-endocardique. La référence est la ligne isoélectrique."},
{q:"Nécrose myocardique :",o:["Onde Q pathologique","Durée ≥ 4/100 s","Amplitude ≥ 25 % du QRS","Aspect qR ou QS","Se traduit par un sus-décalage de ST"],a:"ABCD",e:"Q pathologique : ≥ 0,04 s et ≥ 25 % du QRS ; aspect qR ou QS. Le sus-décalage ST = lésion."},
{q:"Associations exactes :",o:["T négative, symétrique, pointue → ischémie sous-épicardique","ST sus-décalé → lésion sous-endocardique","Onde Q large et profonde → nécrose","T positive, ample, symétrique, pointue → ischémie sous-endocardique","Aspect QS → nécrose transmurale"],a:"ACDE",e:"B faux : sus-décalage = sous-épicardique. QS = disparition complète de R (nécrose transmurale)."},
{q:"Stade 1 de Holtzman (inflammation) :",o:["Survient dans les 24 premières heures","Sus-décalage ST concave vers le haut (selle de chameau)","Le sus-décalage n’englobe pas l’onde T","Sous-décalage de PQ","Onde T négative d’emblée"],a:"ABCD",e:"Stade 1 : ST concave « en selle de chameau », n’englobant pas T, avec sous-décalage PQ. La négativation de T = stade 3."},
{q:"Stades 2, 3 et 4 de Holtzman :",o:["Stade 2 (24-48 h) : retour de ST à l’iso et aplatissement de T","Stade 3 (1re semaine) : négativation de T","Stade 4 (plusieurs semaines) : normalisation avec repositivation de T","Stade 3 : nouveau sus-décalage de ST","Stade 2 : négativation de T"],a:"ABC",e:"Chronologie : ST ↑ → ST iso + T plate → T négative → T positive. D et E font intervenir des anomalies non décrites à ces stades."},
{q:"Femme de 28 ans, douleur thoracique, sus-décalage ST diffus concave, sous-décalage PQ, T positives. Quelles propositions sont justes ?",o:["Stade 1 de Holtzman","Péricardite aiguë (signes d’inflammation)","Atteinte d’un seul territoire coronaire","Image en miroir franche attendue","Évolution attendue : ST à l’iso et T aplatie en 24-48 h"],a:"ABE",e:"Un sus-décalage diffus, concave, sans miroir et avec sous-décalage PQ n’est pas systématisé à une artère : C et D faux."},
{q:"Péricardite vs atteinte coronarienne : propositions exactes",o:["Péricardite : sus-décalage concave en selle de chameau","Au stade 1, le sus-décalage englobe l’onde T","Le sous-décalage de PQ oriente vers l’inflammation","La négativation de T (stade 3) suit le retour de ST à l’iso","Les 4 stades se déroulent sur 24 heures"],a:"ACD",e:"B faux (n’englobe pas T). E faux : stade 4 survient après plusieurs semaines."},
{q:"BAV du 1er degré :",o:["Allongement simple et fixe de PR","PR > 21/100 s (selon le cours)","Toutes les ondes P sont suivies d’un QRS","Allongement progressif de PR puis onde P bloquée","Onde P bloquée de façon inopinée"],a:"ABC",e:"BAV1 : PR fixe allongé, aucune P bloquée (classiquement seuil 0,20 s ; 21/100 s dans le cours). D = Mobitz I ; E = Mobitz II."},
{q:"BAV du 2e degré – Mobitz I :",o:["Appelé période de Luciani-Wenckebach","PR s’allonge progressivement jusqu’à une P bloquée","Le blocage se répète de façon cyclique","Blocage inopiné sans allongement préalable de PR","Dissociation auriculo-ventriculaire complète"],a:"ABC",e:"D = Mobitz II ; E = BAV 3."},
{q:"Mobitz II et BAV de haut degré :",o:["Mobitz II : onde P bloquée de façon inopinée","Dans Mobitz II, les PR conduits sont constants","BAV 2/1 : une onde P sur deux bloquée","Le BAV 2/1 appartient au haut degré","Dans le BAV 2/1, toutes les ondes P sont conduites"],a:"ABCD",e:"Mobitz II : PR constant puis P bloquée brutale (risque de BAV complet). Dans le 2/1, une P sur deux est bloquée (E faux)."},
{q:"BAV du 3e degré (complet) :",o:["Dissociation auriculo-ventriculaire complète","Absence de liaison entre PP et RR","PR fixe et allongé","Peut être paroxystique ou permanent","Fréquence des ondes P supérieure à celle des QRS"],a:"ABDE",e:"Oreillettes et ventricules battent indépendamment : PR variable (C faux), P plus nombreuses que QRS."},
{q:"Identifier le type de BAV :",o:["PR 0,28 s constant, chaque P suivie d’un QRS : BAV 1","PR 0,16 → 0,22 → 0,30 s puis P bloquée, cycle qui recommence : Mobitz I","PR constant 0,16 s, puis P bloquée brutalement : Mobitz II","Une P sur deux bloquée : BAV 3","PP et RR réguliers mais indépendants : BAV 3"],a:"ABCE",e:"Une P sur 2 bloquée = BAV 2/1 (haut degré du 2e degré), pas un BAV 3."},
{q:"Bloc de branche gauche (BBG) :",o:["Élargissement QRS ≥ 12/100 s","R large exclusive en V5, V6, D1, aVL","Aspect Rs en V1, V2","Onde T s’opposant à R","Onde S large en D1, aVL, V5, V6"],a:"ABCD",e:"E correspond au bloc de branche droit."},
{q:"QRS 0,14 s, aspect rsR’ en V1-V2 avec T négative, S large en D1 et V6. Quelles propositions sont justes ?",o:["Bloc de branche droit","QRS ≥ 12/100 s : critère de bloc complet","Bloc de branche gauche","T négative en V1-V2 attendue","R large exclusive en V5-V6 attendue"],a:"ABD",e:"rsR’ en V1-V2 + S large latérale (D1, aVL, V5, V6) + T < 0 en V1-V2 = BBD. R large exclusive = BBG."},
{q:"Flutter auriculaire :",o:["Tachycardie auriculaire monomorphe et régulière","Fréquence auriculaire de 250 à 350/min","Auriculogrammes = ondes F","Auriculogrammes = ondes f","État de trémulation anarchique des oreillettes"],a:"ABC",e:"D et E décrivent la fibrillation auriculaire."},
{q:"Fibrillation auriculaire :",o:["Trémulation anarchique et inefficace des oreillettes","Fréquence auriculaire de 400 à 600/min","Ondes f","Activité auriculaire régulière et monomorphe","Auriculogrammes = ondes F"],a:"ABC",e:"FA = ondes f irrégulières ; D et E correspondent au flutter."},
{q:"Troubles du rythme : propositions exactes",o:["Tachycardie : Fc > 100/min","Bradycardie : Fc < 60/min","Trois variétés : accélération excessive, ralentissement excessif, arythmie","Arythmies : auriculaires, jonctionnelles, ventriculaires","Tachycardie sinusale : Fc > 120/min"],a:"ABCD",e:"Le seuil de la tachycardie sinusale est 100/min (E faux)."},
{q:"Calculs sur papier à 25 mm/s (1 grand carreau = 0,20 s) :",o:["RR = 3 grands carreaux → 100/min, limite sans tachycardie","RR = 6 grands carreaux → 50/min, bradycardie si rythme sinusal","Flutter à 300/min conduit 2/1 → Fc ventriculaire 150/min","PR de 5 petits carreaux (0,20 s) : pas de BAV 1 selon le cours","QRS de 3 petits carreaux (0,12 s) : inférieur au seuil de bloc de branche"],a:"ABCD",e:"Fc = 300 / nb de grands carreaux. Un QRS de 0,12 s atteint le seuil (≥ 12/100 s) : E faux."},
{q:"Arythmies jonctionnelles :",o:["Dysrythmie naissant au niveau de la jonction auriculo-ventriculaire","La tachycardie jonctionnelle est la plus fréquente","Tachycardie à QRS fins, jusqu’à 180/min","Ondes P’ rétrogrades cachées dans le QRS","QRS larges déformés, aspect de bloc de branche"],a:"ABCD",e:"La conduction est antérograde par le système normal : QRS fins. Les QRS larges évoquent la TV."},
{q:"Tachycardie ventriculaire :",o:["Succession de plus de 3 extrasystoles ventriculaires","Fc entre 100 et 300/min","Ondes P plus nombreuses que les QRS","QRS anormaux avec aspect de bloc de branche","Torsade de pointes : QRS d’amplitude et de polarité variables « en fuseau » (TV polymorphe)"],a:"ABDE",e:"Le rythme est généralement régulier ; en TV les P sont moins nombreuses que les QRS (dissociation AV). C faux."},
{q:"ECG de TV avec dissociation AV, « capture beat » et « fusion beat » :",o:["La dissociation AV soutient le diagnostic de TV","Un complexe de capture est pathognomonique","Un complexe de fusion est pathognomonique","Capture : un influx sinusal active exceptionnellement les ventricules (QRS fin précoce)","La présence de complexes de capture élimine la TV"],a:"ABCD",e:"Fusion = QRS hybride (influx sinusal + foyer ventriculaire). Capture et fusion prouvent l’origine ventriculaire (E faux)."},
{q:"Fibrillation ventriculaire :",o:["Désynchronisation complète des fibres ventriculaires","Ondulations changeantes en amplitude, largeur et forme","Fréquence des ondulations 250-500/min","Réversible spontanément","Inefficacité hémodynamique totale = arrêt circulatoire"],a:"ABCE",e:"La FV est irréversible spontanément : urgence vitale nécessitant réanimation et choc électrique externe (D faux)."}
];
const app=document.getElementById("app");let score=0,done=0;
Q.forEach((x,i)=>{const d=document.createElement("div");d.className="card";
d.innerHTML=`<h3><span>Q${i+1}.</span> ${x.q}</h3>`+x.o.map((t,j)=>`<button class="o" data-l="${"ABCDE"[j]}"><b>${"ABCDE"[j]}</b>${t}</button>`).join("")+`<button class="v">Valider</button><div class="e"></div>`;
const bs=[...d.querySelectorAll(".o")];
bs.forEach(b=>b.onclick=()=>{if(!d.dataset.f)b.classList.toggle("sel")});
d.querySelector(".v").onclick=function(){const s=bs.filter(b=>b.classList.contains("sel")).map(b=>b.dataset.l).join("");
bs.forEach(b=>{const l=b.dataset.l,c=x.a.includes(l),k=b.classList.contains("sel");b.classList.remove("sel");
if(c&&k)b.classList.add("ok");else if(!c&&k)b.classList.add("ko");else if(c)b.classList.add("ms")});
d.dataset.f=1;this.disabled=true;done++;const good=s===x.a;if(good)score++;
const e=d.querySelector(".e");e.style.display="block";e.innerHTML=`<b>${good?"✔ Juste":"✘ Incorrect"} – Réponse : ${x.a.split("").join(", ")}</b><br>${x.e}`;
document.getElementById("sc").textContent=score;document.getElementById("an").textContent=done};
app.appendChild(d)});
</script></body></html>
