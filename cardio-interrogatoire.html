<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz Sémiologie – 3e année</title>
<style>
:root{--bg:#faf7f5;--fg:#2a1a1f;--card:#fff;--bd:#e3d6d8;--ac:#8b2a3c;--ok:#1f7a45;--okb:#e1f4e8;--ko:#b3261e;--kob:#fbe4e2;--mu:#6b5a5e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17110f;--fg:#f3e9e7;--card:#241a18;--bd:#4a3a38;--ac:#e58a9b;--ok:#6fd49a;--okb:#14301f;--ko:#ff9a92;--kob:#3a1714;--mu:#b9a7a9;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17110f;--fg:#f3e9e7;--card:#241a18;--bd:#4a3a38;--ac:#e58a9b;--ok:#6fd49a;--okb:#14301f;--ko:#ff9a92;--kob:#3a1714;--mu:#b9a7a9;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Georgia,serif}
main{max-width:760px;margin:0 auto;padding:14px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5;border-bottom:1px solid var(--bd)}
h1{font-size:20px;margin:0;color:var(--ac)}
#sc{font:14px sans-serif;color:var(--mu)}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin:14px 0}
.q h2{font-size:16px;margin:0 0 4px}.q small{color:var(--mu);font:12px sans-serif}
label{display:flex;gap:8px;align-items:flex-start;padding:8px;margin:6px 0;border:1px solid var(--bd);border-radius:8px;cursor:pointer}
label input{margin-top:5px}
label.ok{background:var(--okb);border-color:var(--ok)}label.ko{background:var(--kob);border-color:var(--ko)}label.miss{border:2px dashed var(--ok)}
button{background:var(--ac);color:var(--bg);border:0;border-radius:8px;padding:9px 16px;font:15px sans-serif;cursor:pointer}
.ex{margin-top:8px;padding:10px;border-left:4px solid var(--ac);background:var(--bg);font-size:14px;display:none}
.res{font:600 14px sans-serif;margin-top:8px}
</style></head><body><main>
<header><h1>Quiz de sémiologie – niveau expert</h1><div id="sc"></div></header>
<p style="font-size:14px;color:var(--mu)">30 QCM à réponses multiples (A–E). Une ou plusieurs propositions sont exactes. Correction stricte : toutes les bonnes réponses et aucune fausse.</p>
<div id="app"></div>
<p><button onclick="location.reload()">Recommencer</button></p>
</main>
<script>
const Q=[
["Concernant la définition de la sémiologie :",["Elle comprend l’interrogatoire et l’examen clinique du malade","Elle vise à recueillir les informations indispensables au diagnostic et au traitement","Elle se limite à l’examen physique","Elle s’écrit aussi « séméiologie »","Elle inclut obligatoirement les examens complémentaires"],"ABD","La sémiologie = interrogatoire + examen clinique (C faux : l’interrogatoire en fait partie ; E faux : les examens complémentaires viennent après), afin de poser un diagnostic et prescrire un traitement."],
["Concernant la chaîne de la démarche médicale :",["Interrogatoire → examen clinique → diagnostic → traitement","Examen clinique → traitement → interrogatoire → diagnostic","Malade mal interrogé + signes mal observés → faux diagnostic → traitement mal conduit","La sémiologie est la « fondation » des connaissances médicales","Un bon traitement compense un interrogatoire mal mené"],"ACD","L’ordre logique est A. C illustre l’enchaînement d’erreurs : la sémiologie est la fondation (D). E est faux : un traitement ne corrige pas un diagnostic fondé sur une mauvaise base."],
["Savoir, savoir-faire, savoir-être :",["Le savoir est la connaissance livresque : description théorique des symptômes et signification des signes","Le savoir-faire est la collecte des signes au lit du malade en stage et la rédaction d’observations","Le savoir-être inclut respect, écoute, consentement, secret médical, compassion","Le savoir-être est facultatif en 3e année","Le savoir correspond à la connaissance clinique"],"ABC","La connaissance clinique (E) relève du savoir-faire, pas du savoir. Le savoir-être est indissociable : le malade est un être humain qui souffre (D faux)."],
["L’« esprit à cultiver » du médecin :",["Objectivité, disponibilité, méthodologie","Le médecin utilise ses connaissances sémiologiques 50 à 100 fois par jour, toute sa vie","Les symptômes ont beaucoup varié avec la technologie","La recherche des signes se fait organe par organe, appareil par appareil","L’ordre de recherche des signes change selon chaque patient"],"ABD","Les symptômes n’ont pas varié avec la technologie (C faux). L’ordre de recherche est répété, toujours identique (E faux), ce qui garantit l’exhaustivité."],
["L’observation médicale comporte :",["L’art de rédiger et de mettre en forme les informations recueillies","Une approche intellectuelle, logique et méthodique","Trois temps : interrogatoire, examen physique, conclusion clinique","Un interrogatoire pouvant porter sur l’entourage et/ou les documents médicaux","Un examen physique qui commence par l’appareil concerné, puis l’examen général"],"ABCD","L’examen physique débute par l’examen général, puis l’appareil concerné, puis les autres appareils (E faux)."],
["L’identité du malade comprend :",["Nom et prénom","Âge, sexe","Profession","Origine géographique et résidence actuelle","Mode de vie et alimentation"],"ABCDE","Toutes ces rubriques figurent dans l’identité : il faut « faire attentivement sa connaissance » du malade pour qu’il livre toutes les informations nécessaires."],
["Le motif de consultation :",["Est toujours un symptôme (signe fonctionnel)","Est la plainte principale qui amène le malade à consulter","Peut être un diagnostic déjà posé","Peut être un signe physique","Est exprimé avec les mots du malade, sous forme de signe fonctionnel"],"ABE","Le motif n’est ni un diagnostic (C) ni un signe physique (D) : c’est toujours un symptôme."],
["Quels énoncés constituent un motif de consultation correct ?",["« Essoufflement à la montée des escaliers depuis 3 mois »","« Insuffisance cardiaque »","« Souffle »","« Douleur thoracique à l’effort »","« Palpitations »"],"ADE","« Insuffisance cardiaque » est un diagnostic et « souffle » un signe physique : tous deux sont incorrects. A, D, E sont des symptômes."],
["Les 7 attributs de la plainte principale comprennent :",["Siège","Circonstances","Pronostic","Facteurs de rémission ou d’aggravation","Signes associés"],"ABDE","Les 7 attributs : siège, qualité, intensité, chronologie, circonstances, facteurs de rémission/aggravation, signes associés. Le pronostic n’en fait pas partie."],
["Détail des attributs de la plainte :",["Siège : fixe ? irradiations ? oriente vers l’organe","Intensité : douleur 1–10 ; dyspnée NYHA I–IV","Chronologie : début, durée, récurrence","Qualité : à quoi ressemble-t-il ?","Circonstances : manifestations accompagnant la plainte"],"ABCD","Les manifestations accompagnantes sont les signes associés ; les circonstances sont le froid, l’effort, les repas… (E faux)."],
["Les antécédents :",["Personnels : médicaux","Familiaux : parents du 1er degré","Médicamenteux : traitements en cours, posologie","Chirurgicaux : interventions, dates","Obstétricaux : gestité, parité, pour tous les patients"],"ABCD","Les antécédents obstétricaux (gestité, parité) concernent uniquement les femmes (E faux)."],
["« À ne jamais oublier » dans l’interrogatoire :",["Allergies : médicaments, alimentation, iode, latex","Tabac quantifié en paquets-années","Alcool et activité physique","Vaccinations et contexte socio-familial","Groupe sanguin systématique"],"ABCD","Le groupe sanguin n’est pas listé. Le tabac se quantifie en paquets-années."],
["Examen général et signes vitaux :",["Pression artérielle aux 2 bras","Fréquence cardiaque : /min et régularité","Fréquence respiratoire : /min","SpO₂ : saturation pulsée en O₂ ; température en °C","IMC exprimé en g/cm²"],"ABCD","L’IMC s’exprime en kg/m² (E faux). Poids, taille et IMC complètent les signes vitaux."],
["L’état général est apprécié dès l’interrogatoire. Peut-on le décrire comme :",["Conscient, obnubilé, comateux","Agité, pâle","Dyspnéique, déshydraté","Cyanosé, ictérique","Cette appréciation se fait seulement après l’examen des appareils"],"ABCD","L’état général s’apprécie dès l’interrogatoire, avant l’examen détaillé (E faux)."],
["Les signes généraux :",["Asthénie : sensation de fatigue généralisée","Anorexie : absence ou diminution de l’appétit","Amaigrissement : perte ≥ 5 % en 1 mois ou ≥ 10 % en 6 mois","Fièvre : élévation régulée de la température centrale > 38 °C au repos","Fièvre : température > 37,5 °C quelle que soit la situation"],"ABCD","Seuil de la fièvre du cours : > 38 °C au repos (E faux). Les pertes de poids sont rapportées au poids habituel."],
["L’altération de l’état général (AEG) :",["Association de l’asthénie, de l’anorexie et de l’amaigrissement","Témoin d’une maladie somatique ou psychiatrique (dépression)","Signe spécifique d’un organe","Regroupe des signes non spécifiques évaluant l’état global et le retentissement","La fièvre fait partie du trio de l’AEG"],"ABD","Les signes généraux n’ont pas de caractéristique d’organe (C faux). La fièvre est un signe général mais ne fait pas partie du trio AEG (E faux)."],
["Inspection et palpation :",["Inspection : forme (tuméfaction, atrophie), couleur (éruption, ictère, pâleur), attitude, comportement","Inspection : patient allongé, torse nu, bonne lumière","Palpation : sensibilité des doigts, anomalies morphologiques (abdomen, membres)","Palpation : inclut les pouls périphériques","Palpation : recherche des anomalies audibles"],"ABCD","Les anomalies audibles relèvent de la percussion (matité, sonorité, tympanisme) et de l’auscultation."],
["Percussion et auscultation :",["Percussion : matité, sonorité, tympanisme (thorax, abdomen)","Percussion : majeur et annulaire de la main dominante frappant les doigts de l’autre main","Auscultation : poumons (air), cœur (valves, flux), abdomen (bruits hydro-aériques), artères (souffles de sténose)","Percussion réalisée avec l’index","Auscultation : recherche d’anomalies palpables"],"ABC","On percute avec majeur et annulaire (D faux). Le stéthoscope sert à l’écoute (E faux)."],
["Le résumé syndromique : « Patient de 58 ans, commerçant, admis pour dyspnée d’effort stade III NYHA, bon état général, œdèmes des membres inférieurs prenant le godet et turgescence jugulaire ». Il contient :",["L’identité (âge, profession, origine)","Le motif sous forme de symptôme précisé (stade NYHA)","Les signes positifs de l’examen","Le diagnostic « insuffisance cardiaque »","Le traitement"],"ABC","Le résumé syndromique est une synthèse sémiologique : il ne contient ni diagnostic (D) ni traitement (E), qui viennent après."],
["Le diagnostic final est triple :",["Fonctionnel : ex. insuffisance cardiaque","Lésionnel : ex. sténose mitrale","Étiologique : ex. rhumatisme cardiaque","Étiologique : ex. sténose mitrale","Fonctionnel : ex. rhumatisme cardiaque"],"ABC","Fonctionnel = trouble de la fonction, lésionnel = lésion en cause, étiologique = cause. Sténose mitrale est lésionnelle (D faux), rhumatisme cardiaque étiologique (E faux)."],
["De l’examen à la conclusion :",["Les hypothèses diagnostiques correspondent à une présomption","La synthèse clinique est le résumé syndromique","Les examens complémentaires précèdent la synthèse clinique","La conclusion et la conduite thérapeutique viennent en dernier","L’examen des autres appareils précède celui de l’appareil de la plainte"],"ABD","Ordre : appareil de la plainte → autres appareils → synthèse → hypothèses → examens complémentaires → conclusion et conduite thérapeutique."],
["Qui fait quoi en stage ? En 3e année :",["On recueille les informations cliniques","On termine par la synthèse clinique (résumé syndromique)","On ajoute les hypothèses diagnostiques et la demande du bilan","L’objectif est une observation complète jusqu’au résumé syndromique","On propose le traitement"],"ABD","Hypothèses et bilan sont l’objectif des 4e–5e années ; traitement en 6e–7e."],
["Progression au cours des années :",["4e–5e année : ajoute les hypothèses diagnostiques et la demande du bilan","6e–7e année : pose le diagnostic et propose le traitement","6e–7e année : s’arrête au résumé syndromique","4e–5e année : propose le traitement","La 3e année pose le diagnostic"],"AB","La progression est cumulative : 3e = résumé syndromique, 4e–5e = hypothèses et bilan, 6e–7e = diagnostic et traitement."],
["Plan de rédaction d’une observation (10 points) :",["Les antécédents (4) précèdent l’examen clinique (5)","Le résumé syndromique (6) précède les hypothèses diagnostiques (7)","La conclusion (9) précède les examens complémentaires (8)","Le traitement est le dernier point (10)","L’examen clinique débute par les autres appareils"],"ABD","Ordre : identité, motif, histoire, antécédents, examen clinique, résumé syndromique, hypothèses, examens complémentaires, conclusion, traitement. L’examen clinique : général, puis appareil de la plainte, puis les autres."],
["Appareils à examiner :",["Cardiovasculaire, respiratoire, digestif","Ostéoarticulaire, neurologique, dermatologique","Aires ganglionnaires, urinaire","ORL, stomatologique, gynécologique","Endocrinien, hématologique"],"ABCD","Les appareils du cours sont ceux de A à D ; « endocrinien » et « hématologique » n’y figurent pas."],
["Définitions sémiologiques (1) :",["Symptôme : ressenti et décrit par le malade ; absence = maladie asymptomatique","Signe général : fièvre, amaigrissement, anorexie, asthénie","Signe physique : observé objectivement par le médecin (masse palpable, souffle cardiaque)","Le souffle cardiaque est un symptôme","La dyspnée est un signe physique"],"ABC","Le souffle est un signe physique (D faux), la dyspnée un symptôme (E faux)."],
["Qualifier un signe :",["Positif/négatif : présent ou absent","Constant/inconstant : toujours retrouvé ou non dans la pathologie","Spécifique/non spécifique : oriente vers une pathologie ou non","Pathognomonique : présent uniquement dans une seule maladie","Pathognomonique : constant dans plusieurs maladies"],"ABCD","Pathognomonique est le plus fort degré de spécificité : une seule maladie (E faux)."],
["Définitions sémiologiques (2/2) – I :",["Tableau clinique : ensemble des signes habituellement recueillis chez un patient atteint d’une maladie","Syndrome : ensemble de signes et symptômes simultanés orientant vers un diagnostic","Diagnostic : acte intellectuel qui rassemble et interprète signes et symptômes","Pronostic : étude des causes de la maladie","Nosologie : classement des maladies les unes par rapport aux autres"],"ABCE","Le pronostic est la prévision de l’évolution probable ; l’étude des causes est l’étiologie (D faux)."],
["Définitions sémiologiques (2/2) – II :",["Étiologie : étude des causes des maladies","Pronostic : prévision de l’évolution probable de la maladie","Traitement : ensemble des moyens employés pour guérir une maladie","Nosologie : étude des causes des maladies","Le glossaire est à compléter au fil des stages"],"ABCE","La nosologie classe les maladies (D faux)."],
["Plan du cours et objectifs pédagogiques :",["Partie II : symptômes dont toux et hémoptysie","Partie III : examen artériel, IPS, TVP, AOMI, insuffisance veineuse","Objectif : examiner artères et veines (pouls, IPS, troubles trophiques, signes de TVP)","Objectif : analyser les grands symptômes cardiovasculaires dont la dyspnée (NYHA)","La partie I (sémiologie générale) traite de la dyspnée et des œdèmes"],"ABCD","La partie I couvre définition, observation médicale et définitions sémiologiques ; les symptômes cardiovasculaires sont en partie II."]
];
const L="ABCDE",app=document.getElementById("app");let score=0,done=0;
function upd(){document.getElementById("sc").textContent="Score : "+score+" / "+Q.length+" · Répondues : "+done+" / "+Q.length}
Q.forEach((q,i)=>{const d=document.createElement("div");d.className="q";
d.innerHTML="<small>Question "+(i+1)+"/30</small><h2>"+q[0]+"</h2>"+q[1].map((o,j)=>"<label><input type='checkbox' value='"+L[j]+"'><span><b>"+L[j]+".</b> "+o+"</span></label>").join("")+"<button>Valider</button><div class='res'></div><div class='ex'></div>";
const b=d.querySelector("button");b.onclick=()=>{const bx=[...d.querySelectorAll("input")];const sel=bx.filter(x=>x.checked).map(x=>x.value).join("");
bx.forEach(x=>{x.disabled=true;const l=x.parentElement,ok=q[2].includes(x.value);if(x.checked)l.classList.add(ok?"ok":"ko");else if(ok)l.classList.add("miss")});
const good=sel===q[2];if(good)score++;done++;b.remove();
d.querySelector(".res").textContent=(good?"✔ Correct":"✘ Incorrect")+" — Réponses exactes : "+q[2].split("").join(", ");
const e=d.querySelector(".ex");e.style.display="block";e.textContent="Justification : "+q[3];upd()};
app.appendChild(d)});upd();
</script></body></html>
