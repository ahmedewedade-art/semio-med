<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QCM – Sémiologie de la thyroïde</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--tx:#1d1d1b;--mu:#6b6b66;--bd:#dcdcd6;--ok:#1a7f4b;--okb:#e3f4ea;--ko:#b3261e;--kob:#fbe7e5;--ac:#2b5fd9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--card:#232321;--tx:#ececE8;--mu:#a3a39d;--bd:#3a3a36;--ok:#5fd194;--okb:#16301f;--ko:#ff8a80;--kob:#3a1c1a;--ac:#7aa2ff}}
:root[data-theme="dark"]{--bg:#171716;--card:#232321;--tx:#ececE8;--mu:#a3a39d;--bd:#3a3a36;--ok:#5fd194;--okb:#16301f;--ko:#ff8a80;--kob:#3a1c1a;--ac:#7aa2ff}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:.2em 0}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;display:flex;justify-content:space-between;align-items:center;z-index:5;border-bottom:1px solid var(--bd);font-weight:600}
h2{font-size:.95rem;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;margin:26px 0 8px}
.q{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.q p{margin:0 0 10px;font-weight:600}
label{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border:1px solid var(--bd);border-radius:8px;margin:5px 0;cursor:pointer}
label.ok{background:var(--okb);border-color:var(--ok)}label.ko{background:var(--kob);border-color:var(--ko)}
label.miss{border-style:dashed;border-color:var(--ok)}
input{margin-top:5px}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;cursor:pointer;margin-top:6px}
button:disabled{opacity:.4}
.ex{display:none;margin-top:10px;padding:10px;border-left:4px solid var(--ac);background:var(--bg);font-size:.92rem}
.s{font-weight:700;margin-top:8px}
</style></head><body><main>
<h1>QCM – Sémiologie de la glande thyroïde</h1>
<p style="color:var(--mu);margin:0 0 8px">Chaque question : 5 propositions (A–E), une ou plusieurs réponses exactes. Une question est juste uniquement si toutes les bonnes réponses, et elles seules, sont cochées.</p>
<div class="bar"><span id="sc">Score : 0 / 0</span><button id="rs" style="margin:0;padding:6px 12px">Recommencer</button></div>
<div id="app"></div>
</main>
<script>
const Q=[
[2,"À propos de l’anatomie du corps thyroïdien :",["Il enserre la face antérieure du cou en fer à cheval, avec deux lobes latéraux et un isthme médian","Les faces postérieures des bords latéraux sont en contact étroit avec les nerfs récurrents et les parathyroïdes","Il adhère à la trachée et à l’œsophage, d’où sa mobilité à la déglutition","Il est situé à la face postérieure du cou, en arrière de la trachée","Il possède un lobe médian et un isthme latéral"],"ABC","D faux : face antérieure du cou. E faux : deux lobes latéraux réunis par l’isthme médian."],
[3,"Concernant la régulation et les actions des hormones thyroïdiennes :",["T3 et T4 sont régulées par la TSH hypophysaire par rétrocontrôle (feed-back)","La TSH est sous le contrôle de la TRH hypothalamique","La TRH est sécrétée par l’hypophyse","Elles stimulent la croissance et la morphogenèse","Elles freinent la maturation du système nerveux"],"ABD","C faux : TRH hypothalamique. E faux : elles favorisent la maturation du système nerveux."],
[4,"Actions métaboliques des hormones thyroïdiennes :",["Action sur le métabolisme de base et la thermorégulation","Action sur le système nerveux, le cœur, le tube digestif et les muscles","Elles sont hypoglycémiantes","Elles sont anabolisantes pour les protides à faible dose et catabolisantes à forte dose","Elles catabolisent les graisses"],"ABDE","C faux : elles provoquent une hyperglycémie."],
[4,"La thyrocalcitonine :",["Est sécrétée par les cellules parafolliculaires","Possède un pouvoir hypocalcémiant","Est sécrétée par les cellules folliculaires","Est hypercalcémiante","Est stimulée par la TSH"],"AB","C faux : cellules parafolliculaires (les folliculaires font T3/T4). D faux : hypocalcémiante. E faux : sa sécrétion n’est pas sous contrôle de la TSH (cours : TSH régule T3/T4)."],
[5,"Inspection de la région thyroïdienne :",["Patient assis face à l’examinateur, tête légèrement penchée en avant","Elle apprécie le volume de la glande et son caractère limité ou diffus","Elle étudie la peau en regard et le caractère pulsatile des vaisseaux du cou","Patient en décubitus, tête en hyperextension","Elle ne permet pas d’apprécier le volume de la glande"],"ABC","D faux : assis, tête légèrement penchée en avant. E faux : le volume est apprécié dès l’inspection."],
[6,"Palpation thyroïdienne :",["Le médecin se place derrière le patient","Les doigts enserrent la région de haut en bas","On demande au patient d’avaler sa salive","Le thrill est la traduction tactile d’un souffle","Elle apprécie la mobilité par rapport à la déglutition"],"ACDE","B faux : de bas en haut."],
[6,"Thrill, souffle et auscultation :",["Le thrill correspond à la perception tactile d’un souffle","L’auscultation recherche un souffle thyroïdien","Le thrill est une vibration perçue à l’oreille","Thrill et souffle sont retrouvés dans le goitre diffus, homogène et vasculaire de la maladie de Basedow","Ils sont typiques de l’hypothyroïdie par atrophie"],"ABD","C faux : tactile. E faux : l’hypothyroïdie s’accompagne d’une atrophie, sans thrill."],
[7,"L’examen régional recherche :",["Les aires ganglionnaires antérieures et latérales","Les aires sus-claviculaires","Les aires trapéziennes et spinales","Les aires inguinales","Les limites inférieures de la glande (goitre plongeant)"],"ABCE","D faux : territoires cervicaux uniquement."],
[7,"Signes de compression d’un goitre :",["Respiratoires : wheezing, dyspnée, cyanose","Digestifs : dysphagie","Nerveux : voix bitonale","Digestifs : diarrhée motrice","Auditifs : hypoacousie"],"ABC","D est un signe de thyrotoxicose, E un signe d’hypothyroïdie (infiltration muqueuse)."],
[8,"Hyperthyroïdie, signes cardiovasculaires :",["Hypersécrétion d’hormones thyroïdiennes ; description type : maladie de Basedow","Dyspnée d’effort, palpitations","Tachycardie supérieure à 100/min","Vaisseaux du cou hyperpulsatiles, pouls bien frappés, B1 intense à la pointe, souffle systolique fréquent","Bradycardie avec B1 assourdi"],"ABCD","E faux : éréthisme cardiovasculaire avec tachycardie."],
[9,"Hyperthyroïdie, autres signes de thyrotoxicose :",["Tremblement fin, régulier, aux extrémités, mis en évidence par le signe du serment","Tremblement ample et irrégulier au repos","Amaigrissement rapide, supérieur à 10 kg en quelques mois","Faiblesse musculaire révélée par le signe du tabouret","Le signe du tabouret : impossibilité de se lever d’un siège bas sans prendre appui sur les mains"],"ACDE","B faux : tremblement fin et régulier."],
[10,"Hyperthyroïdie, manifestations psychiques et générales :",["Irritabilité, émotivité, agitation","Thermophobie, peau chaude avec mains moites","Polydipsie et polyphagie","Constipation et frilosité","Troubles des règles chez la femme"],"ABCE","D faux : diarrhée motrice fréquente et chaleur (thermophobie)."],
[11,"Maladie de Basedow, terrain et goitre :",["Femme de 30 à 40 ans","Souvent après un stress émotif, psychique ou un événement de la vie génitale","Goitre diffus, homogène, vasculaire, avec thrill et souffle","Exophtalmie acquise, bilatérale et symétrique","Exophtalmie unilatérale et asymétrique"],"ABCD","E faux : bilatérale et symétrique."],
[11,"Éléments de l’exophtalmie basedowienne :",["Œdème palpébral","Rétraction de la paupière supérieure","Regard brillant et tragique","Asynergie oculo-palpébrale","Énophtalmie avec ptosis"],"ABCD","E faux : il s’agit d’une exophtalmie avec rétraction palpébrale."],
[12,"Myxœdème prétibial :",["Infiltration bilatérale de la peau du 1/3 inférieur de la face latérale de la jambe","S’arrête brutalement au niveau du cou-de-pied","Aspect de « peau de porc » avec quelques rares cheveux","Siège au 1/3 supérieur de la face antérieure de la cuisse","Est typiquement unilatéral"],"ABC","D et E faux : bilatéral, 1/3 inférieur de la jambe."],
[12,"Examens paracliniques de l’hyperthyroïdie :",["T3 et T4 augmentées","TSH abaissée","TSH augmentée","Échographie","Scintigraphie"],"ABDE","C faux : la TSH est freinée par le feed-back."],
[13,"Maladie de Basedow, mécanisme :",["Thyroïdite auto-immune","Anticorps anti-récepteur de la TSH","Ces anticorps mimant l’action de la TSH stimulent la sécrétion hormonale","Anticorps destructeurs de la thyroglobuline avec hypothyroïdie","Anticorps bloquant le récepteur de la TSH"],"ABC","D et E faux : les anticorps sont stimulants."],
[13,"Adénome toxique :",["Tumeur bénigne","Touche plus souvent la femme d’âge mûr (40–60 ans)","Hyperfixation localisée à la scintigraphie","Touche surtout l’homme jeune","Nodule froid à la scintigraphie"],"ABC","D et E faux : nodule hyperfixant (chaud)."],
[14,"Goitre multihétéronodulaire hyperthyroïdien :",["Touche plus souvent le sujet âgé","Goitre diffus, irrégulier et bosselé","Échographie et scintigraphie : plusieurs nodules chauds","Exophtalmie constante","Un seul nodule froid"],"ABC","D faux : pas d’exophtalmie (propre à Basedow). E faux : plusieurs nodules chauds."],
[14,"Thyrotoxicose factice iatrogène :",["Médicaments incriminés : lithium, interféron","Pas de goitre ni d’exophtalmie","Glande blanche à la scintigraphie","Goitre vasculaire avec souffle","Hyperfixation diffuse"],"ABC","D et E faux : glande blanche (non fixante)."],
[14,"Thyroïdite de De Quervain :",["Survient 4 à 6 semaines après une infection virale","Syndrome pseudo-grippal","Goitre ferme et très douloureux","Goitre mou, indolore","Due à des anticorps anti-récepteur de la TSH"],"ABC","D faux : très douloureux. E faux : mécanisme propre à Basedow."],
[15,"Hypothyroïdie acquise de la femme ménopausée :",["Syndrome d’hypométabolisme avec ralentissement global des fonctions","Apathie, parole très lente, gestes lents","Frilosité, bradycardie, constipation, anorexie","Thermophobie et polyphagie","Tachycardie et diarrhée"],"ABC","D, E faux : signes d’hyperthyroïdie."],
[15,"Infiltration cutanéo-muqueuse de l’hypothyroïdie :",["Myxœdème de la face et des extrémités","Face arrondie en pleine lune","Lèvres et paupières épaisses","Rides profondes","Peau fine, chaude et moite"],"ABCD","E faux : peau sèche et rugueuse."],
[16,"Extrémités et muqueuses en hypothyroïdie :",["Mains et pieds épais, doigts boudinés","Macroglossie","Hypoacousie","Voix sourde et grave","Voix aiguë"],"ABCD","E faux : voix sourde et grave."],
[16,"Peau et phanères en hypothyroïdie :",["Ongles cassants","Cheveux rares, avec raréfaction des sourcils, des poils axillaires et pubiens","Peau sèche et rugueuse","Peau moite et chaude","Cheveux abondants"],"ABC","D, E faux."],
[17,"Autres signes de l’hypothyroïdie :",["Atrophie du corps thyroïdien","Insuffisance cardiaque et coronaire, parfois épanchement péricardique","Syndrome cérébelleux","Asthénie, myalgies et crampes contrastant avec l’hypertrophie musculaire","Gros goitre toujours présent"],"ABCD","E faux : atrophie du corps thyroïdien."],
[17,"Biologie de l’hypothyroïdie :",["T3 et T4 abaissées","TSH augmentée","Anémie","Cholestérol augmenté","Hypocholestérolémie"],"ABCD","E faux : hypercholestérolémie."],
[18,"Formes cliniques et causes de l’hypothyroïdie :",["Forme centrale d’origine hypophysaire","Dans la forme centrale, absence d’infiltration cutanéo-muqueuse","TSH élevée dans la forme centrale","Causes : idiopathique, thyroïdite, iatrogène, hypophysaire, goitre endémique","La maladie de Basedow est une cause classique"],"ABD","C faux : TSH non élevée (origine hypophysaire). E faux : cause d’hyperthyroïdie."]
];
const L="ABCDE";let done=0,good=0,lp=0;
const app=document.getElementById("app");
function build(){app.innerHTML="";done=good=lp=0;upd();
Q.forEach((q,i)=>{
if(q[0]!==lp){lp=q[0];const h=document.createElement("h2");h.textContent="Page "+lp;app.appendChild(h)}
const d=document.createElement("div");d.className="q";
d.innerHTML="<p>"+(i+1)+". "+q[1]+"</p>"+q[2].map((o,j)=>'<label><input type="checkbox" value="'+L[j]+'"><span><b>'+L[j]+".</b> "+o+"</span></label>").join("")+'<button>Valider</button><div class="ex"></div>';
d.querySelector("button").onclick=function(){
const ch=[...d.querySelectorAll("input")];let sel="";
ch.forEach(c=>{if(c.checked)sel+=c.value});
const ok=sel===q[3];
ch.forEach(c=>{c.disabled=true;const l=c.parentNode,r=q[3].includes(c.value);
if(c.checked)l.classList.add(r?"ok":"ko");else if(r)l.classList.add("miss")});
this.disabled=true;done++;if(ok)good++;upd();
const e=d.querySelector(".ex");e.style.display="block";
e.innerHTML='<div class="s" style="color:var(--'+(ok?"ok":"ko")+')">'+(ok?"Correct":"Incorrect")+" – Réponses : "+q[3].split("").join(", ")+"</div>"+q[4]};
app.appendChild(d)})}
function upd(){document.getElementById("sc").textContent="Score : "+good+" / "+done+" (sur "+Q.length+")"}
document.getElementById("rs").onclick=()=>{build();scrollTo(0,0)};
build();
</script></body></html>
