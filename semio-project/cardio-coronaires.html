<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QCM – Insuffisance coronaire</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#5b6475;--bd:#d9deea;--ac:#c0392b;--ok:#1e8e5a;--okb:#e3f5ec;--ko:#c0392b;--kob:#fdeaea;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1b2030;--tx:#e8ebf3;--mu:#98a2b8;--bd:#2c3347;--ac:#ff6b5b;--ok:#4cd08f;--okb:#12301f;--ko:#ff7b7b;--kob:#3a1a1a}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1b2030;--tx:#e8ebf3;--mu:#98a2b8;--bd:#2c3347;--ac:#ff6b5b;--ok:#4cd08f;--okb:#12301f;--ko:#ff7b7b;--kob:#3a1a1a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:.4rem 0}.sub{color:var(--mu);font-size:.9rem;margin-bottom:12px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5;display:flex;justify-content:space-between;font-weight:600;border-bottom:1px solid var(--bd)}
.q{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:14px 0}
.t{font-size:.75rem;color:var(--ac);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.q h2{font-size:1rem;margin:.3rem 0 .6rem}
label{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid var(--bd);border-radius:10px;margin:6px 0;cursor:pointer}
label b{min-width:1.2em}
label.ok{background:var(--okb);border-color:var(--ok)}label.ko{background:var(--kob);border-color:var(--ko)}label.miss{border-style:dashed;border-color:var(--ok)}
button{font:inherit;font-weight:600;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 16px;margin-top:8px;cursor:pointer}
.ex{margin-top:10px;padding:10px;border-radius:10px;background:var(--bg);font-size:.92rem;display:none}
.res{display:none;font-weight:700;margin-top:8px}
#fin{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;text-align:center;display:none;font-size:1.1rem}
</style>
</head>
<body>
<main>
<h1>QCM – Insuffisance coronaire</h1>
<div class="sub">30 questions · 5 propositions (A–E) · une ou plusieurs réponses justes · niveau difficile</div>
<div class="bar"><span id="pg">0/30 validées</span><span id="sc">Score : 0</span></div>
<div id="qs"></div>
<div id="fin"></div>
</main>
<script>
const Q=[
["Définitions","À propos de l’insuffisance coronaire (IC) :",["Elle est secondaire à un déséquilibre entre besoins et apports en O2 du myocarde","L’angor stable résulte d’une diminution des apports en O2","Le SCA résulte d’une diminution des apports en O2","Les deux formes (chronique et aiguë) ont le même mécanisme et la même expression clinique","L’IC chronique correspond à l’angor d’effort stable ou syndrome coronaire chronique (SCC)"],"ACE","B faux : angor stable = ↑ des besoins (effort) ; SCA = ↓ des apports. D faux : les 2 formes sont totalement différentes par leur physiopathologie et leur expression."],
["Classification","Concernant l’IC aiguë (SCA) :",["Le STEMI correspond à l’IDM classique avec sus-décalage ST","Les NSTEMI sont les plus fréquents","L’angor instable fait partie des SCA sans sus-décalage ST","L’IDM sans onde Q (élévation de troponine) est un SCA ST-","L’angor d’effort stable est une forme de SCA"],"ABCD","E faux : l’angor stable est un syndrome coronaire chronique, pas un SCA."],
["Facteurs de risque","Facteurs de risque cardiovasculaires :",["Tabac, HTA et diabète sont modifiables","Stress et sédentarité sont modifiables","L’hérédité est un facteur non modifiable","Le cholestérol est non modifiable","Le sexe et l’âge sont modifiables"],"ABC","D faux : la dyslipidémie est modifiable. E faux : sexe, âge, hérédité = non modifiables. Le risque global augmente avec le cumul des facteurs."],
["Anatomie","Anatomie coronaire :",["Le tronc coronaire gauche naît du sinus de Valsalva et se divise en IVA et circonflexe","L’IVA donne les diagonales et les septales","La circonflexe donne les marginales","L’artère coronaire droite donne l’artère rétro-ventriculaire gauche et l’inter-ventriculaire postérieure","Les marginales sont des branches de l’IVA"],"ABCD","E faux : les marginales dépendent de la circonflexe (CX). L’IVA est divisée en IVA 1, 2, 3 (proximale, moyenne, distale)."],
["Physiopathologie","Consommation myocardique d’O2 :",["Elle dépend de la fréquence cardiaque","Elle dépend de la contractilité (inotropisme)","Elle dépend de la tension pariétale intra-VG","La circulation coronaire non athéromateuse peut multiplier son débit par 4 à 5 (réserve coronaire)","Une baisse de la fréquence cardiaque augmente les besoins en O2"],"ABCD","E faux : toute ↑ de FC, inotropisme ou tension pariétale ↑ les besoins ; une baisse de FC les diminue. La réserve coronaire repose sur la vasomotricité."],
["Ischémie","Conséquences de l’ischémie myocardique :",["Hémodynamiques : altération de la relaxation, ↓ compliance, ↑ pressions du VG","Métaboliques : production de lactates","ECG : troubles de la repolarisation","Cliniques : douleur angineuse, insuffisance cardiaque","Elle survient quand l’apport en O2 dépasse les besoins"],"ABCD","E faux : ischémie = apport insuffisant (débit non augmenté à l’effort ou baisse brusque du flux)."],
["Angor stable","Syndrome coronaire chronique :",["L’angor est un syndrome douloureux thoracique secondaire à l’hypoperfusion coronaire","Il est dit stable si ses modalités n’ont pas changé depuis au moins 3 mois","Il résulte d’une ↑ des besoins en O2 à l’effort","Il est dit stable si inchangé depuis 3 semaines","Il doit être contrôlé pour éviter l’évolution vers un SCA"],"ABCE","D faux : le délai est de 3 mois."],
["Étiologie","Étiologies de l’IC chronique :",["Athérosclérose : 90 % des cardiopathies ischémiques ; plaque fragile pouvant s’ulcérer, se rompre, se thromboser ou se calcifier","Angor vasospastique : vasoconstriction brutale, sévère, intermittente","Coronarites inflammatoires : Behçet, lupus, Takayasu, Horton","IC fonctionnelle : RAo, IAo, HVG (CMH), anémie, hypoxie","Syndrome X : coronaires saines, surtout chez l’homme"],"ABCD","E faux : le syndrome X (angor à coronaires saines) s’observe surtout chez la femme. Les anomalies congénitales font partie des lésions non athéroscléreuses."],
["Clinique","Douleur angineuse typique :",["Siège médian rétro-sternal, profond, large (main à plat)","Irradiation au membre supérieur gauche (épaule, bord interne du bras, poignet), parfois mâchoire, nuque, dos","Cède à la trinitrine correctement administrée en moins d’une minute (test diagnostique)","Persiste plus de 20 min après l’arrêt de l’effort","Type coup de poignard, augmentée à l’inspiration"],"ABC","D faux : elle disparaît en 5 à 10 min à l’arrêt de l’effort. E faux : douleur constrictive, non respiro-dépendante. Déclencheurs : marche rapide, démarrage matinal, escaliers, froid, émotion."],
["Classification ESC","Classification clinique des symptômes (ESC 2019) :",["Angor typique : douleur constrictive thoracique/cou/mâchoire/épaule/bras","Angor typique : déclenchée par l’effort et soulagée par repos ou nitrés en 5 min (3 critères réunis)","Angor atypique : 2 des 3 critères","Douleur non angineuse : 1 seul ou aucun critère","Si le patient décrit sa douleur par l’un des 3 gestes classiques (poing, main à plat…), la probabilité d’origine cardiaque est de 30 %"],"ABCD","E faux : la probabilité est de 77 % (BMJ 1995)."],
["Classification CCS","Classification CCS de l’angor :",["Stade I : douleur pour efforts importants ou inhabituels, sans gêne quotidienne","Stade II : marche en côte ou marche rapide","Stade III : efforts peu importants comme la marche lente","Stade IV : douleur de repos","Stade I : gêne dans la vie quotidienne"],"ABCD","E faux : au stade I il n’y a pas de gêne dans la vie quotidienne."],
["Examen clinique","Examen clinique d’un angor chronique :",["Il est souvent normal","On recherche le niveau de PA","On recherche d’autres localisations de l’athérosclérose (palpation/auscultation des trajets artériels)","Des xanthomes ou xanthélasmas peuvent orienter vers une dyslipidémie","Un souffle d’IM est constant"],"ABCD","E faux : l’examen est le plus souvent normal ; on recherche aussi les diagnostics différentiels."],
["ECG angor","ECG dans l’angor chronique :",["L’ECG inter-critique est normal dans environ 75 % des cas","Ischémie sous-endocardique : T positives, pointues, symétriques","Ischémie sous-épicardique : T négatives, pointues, symétriques","Courant de lésion sous-endocardique : sus-décalage de ST","Les ondes Q traduisent une nécrose ancienne"],"ABCE","D faux : courant de lésion sous-endocardique = SOUS-décalage de ST (horizontal ou descendant)."],
["Paraclinique & évolution","Angor chronique : examens et évolution :",["ECG d’effort : examen de première intention pour le diagnostic","L’échocardiographie recherche des troubles de la cinétique et des diagnostics différentiels","Scintigraphie de perfusion d’effort, écho d’effort/dobutamine, IRM de stress, coroscanner sont possibles","Complications : SCA, troubles du rythme, insuffisance cardiaque, mort subite","La coronarographie est l’examen de première intention"],"ABCD","E faux : la coronarographie vient après les tests non invasifs ; l’ECG d’effort est de 1re intention."],
["SCA – physiopathologie","À propos du SCA :",["Ischémie aiguë par occlusion complète (ST+) ou incomplète (ST-) d’une coronaire par un thrombus","Le thrombus fait suite à une rupture de plaque d’athérome","L’athérosclérose coronaire en est responsable dans 95 % des cas","Autres mécanismes : spasme (tabac), embolie (FA, maladies de système), dissection","L’embolie coronaire est la cause la plus fréquente"],"ABCD","E faux : les autres mécanismes sont rares."],
["Diagnostic SCA","Le diagnostic de SCA repose sur un trépied :",["La clinique (douleur thoracique suspecte)","L’ECG (pré-hospitalier)","La biologie : troponine","L’échocardiographie systématique est l’un des 3 piliers","La radiographie thoracique est l’un des 3 piliers"],"ABC","D et E faux : ETT et radio sont des examens complémentaires (ETT systématique, classe I-C, mais hors trépied)."],
["Douleur SCA","Douleur du SCA :",["Au repos, rétro-sternale constrictive « en barre »","Irradiation cervicale et/ou brachiale gauche","Angoissante (sensation de mort imminente), prolongée","Résistante aux dérivés nitrés sublinguaux","Cède en moins d’une minute à la trinitrine"],"ABCD","E faux : c’est le comportement de l’angor stable ; dans le SCA la douleur résiste aux nitrés."],
["Formes cliniques","Présentations d’un SCA ST- :",["Douleur thoracique de repos > 20 min","Angor de novo ≥ classe III CCS","Angor crescendo ≥ classe III CCS","Angor post-IDM","Angor stable de classe I CCS"],"ABCD","E faux : angor stable non modifié depuis ≥ 3 mois = SCC."],
["Atypies & examen","SCA : formes atypiques et examen :",["Douleurs épigastriques possibles","Dyspnée possible","Indigestion possible","Examen rapide, le plus souvent normal ; chercher signes de mauvaise tolérance (↓TA, OAP)","Il faut un examen long avant de réaliser l’ECG"],"ABCD","E faux : l’ECG doit être réalisé en moins de 10 min. Il faut aussi éliminer DAo, péricardite, PNO, EP."],
["ECG – ST+","ECG et SCA ST+ :",["ECG en moins de 10 min","18 dérivations (12 + V7, V8, V9, V3r, V4r, VE)","Sus-décalage persistant de ST dans ≥ 2 dérivations contiguës","Un BBG récent est un équivalent","Un ECG normal élimine un SCA ST-"],"ABCD","E faux : un ECG normal n’élimine pas un SCA ST-."],
["ECG – ST-","SCA ST- : anomalies ECG possibles :",["Tout sauf un sus-décalage persistant de ST","Sus-décalage transitoire de ST","Sous-décalage de ST ≥ 0,5 mm","Négativation de T > 1 mm dans les dérivations à onde R prédominante, ≥ 2 dérivations contiguës","Un sus-décalage ST ≥ 2 mm est obligatoire"],"ABCD","E faux : le sus-décalage persistant définit le ST+, pas le ST-. Ondes T positives amples et pointues possibles."],
["Biologie","Marqueurs et diagnostic final :",["La troponine est le marqueur de référence (CK-MB, myoglobine : moins utilisés)","SCA ST+ : troponine élevée","SCA ST- : troponine élevée ou normale","Angor instable : ST- avec troponine normale ; NSTEMI : IDM sans onde Q","Le diagnostic initial repose sur la troponine"],"ABCD","E faux : le diagnostic initial repose sur l’ECG ; les marqueurs fixent le diagnostic final (angor instable, IDM Q- ou Q+)."],
["Autres examens","Autres examens dans le SCA :",["Bilan biologique standard et radiographie thoracique","ETT systématique (FE, cinétique) – classe I-C","ETT utile au diagnostic différentiel : péricardite, EP, DAo, CMH, RAo","L’ETT remplace l’ECG","Une ETT normale élimine un SCA"],"ABC","D et E faux : l’ETT complète l’ECG et la troponine, sans les remplacer."],
["Diag. différentiel","Causes de douleur thoracique non liées au SCA :",["Pulmonaires : EP, pneumothorax, pneumonie, pleurésie","Vasculaires : dissection aortique, anévrisme symptomatique, AVC","Digestives : œsophagite/reflux, ulcère, pancréatite, cholécystite","Cardiaques : myopéricardite, Tako-Tsubo, sténose aortique, spasme coronaire, tachyarythmie","L’anémie est une cause digestive"],"ABCD","E faux : anémie, herpès et troubles anxieux sont classés « Autres ». Orthopédiques : costochondrite, traumatisme, rachis cervical."],
["Troponine non-SCA","Causes d’élévation de la troponine non liées à un SCA :",["Insuffisance rénale, sepsis, insuffisance respiratoire","AVC, hémorragie sous-arachnoïdienne, brûlures > 30 %","Rhabdomyolyse, toxiques (anthracyclines, 5-FU, herceptine, venins)","Hypothyroïdie, amylose, hémochromatose, sarcoïdose, sclérodermie","L’élévation de troponine est spécifique du SCA"],"ABCD","E faux : myocardite, Tako-Tsubo, EP, crise HTA, DAo, valvulopathie sévère, CMH… élèvent aussi la troponine."],
["ECG – diag. diff.","Anomalies ECG de repolarisation non liées à un SCA :",["Sus-décalage fixe : anévrisme du VG, BBG, WPW, HVG, CMH, repolarisation précoce","Sus-décalage dynamique : péricardite/myocardite, EP, hyperkaliémie, AVC, Tako-Tsubo","Sous-décalage : digoxine, hyperventilation, crise hypertensive, post-tachycardie","T amples : variantes de la normale, hyperkaliémie, AVC/HSA","T négatives : variante normale chez l’homme âgé en précordiales droites"],"ABCD","E faux : la variante normale s’observe chez la femme, l’enfant et l’adolescent."],
["Complications précoces","Complications précoces du SCA :",["Décès/mort subite ; aggravation d’un ST- vers un ST+","TV/FV/ESV ; RIVA = TV lente à 60–100/min","ACFA/flutter, bradycardie, BAV","OAP/choc cardiogénique, IDM du VD, rupture septale, rupture de paroi libre, IM par rupture de pilier, péricardite précoce","Le syndrome de Dressler est une complication précoce"],"ABCD","E faux : Dressler = péricardite tardive (3e semaine)."],
["Complications tardives","Complications tardives post-IDM :",["Syndrome de Dressler (péricardite, 3e semaine)","Anévrysme ventriculaire : ST+ persistant au-delà de la 3e semaine","Le RIVA est une complication tardive","Syndrome épaule-main (algodystrophie) au-delà du 1er mois","La rupture septale est une complication tardive"],"ABD","C faux : le RIVA est précoce. E faux : rupture septale = complication mécanique précoce. Tardifs aussi : cardiopathie ischémique, angor résiduel, TV/FV (DAI)."],
["Cas clinique 1","Homme de 58 ans, DNID, dyslipidémie, tabagisme actif. Douleur rétro-sternale en barre, très intense, angoissante, irradiant à l’épaule et au bras gauche depuis 2 h. TA 140/80, FC 84, SpO2 92 %, râles crépitants aux 2 bases, pas de souffle ni de frottement. ECG : sus-décalage ST en V2–V6, DI, aVL. Quels éléments sont justes ?",["Le diagnostic est un SCA ST+","Il existe des signes d’OAP (râles crépitants, SpO2 92 %)","Le territoire est antérieur étendu (antéro-latéral)","La péricardite est peu probable : douleur en barre, absence de frottement, territoire systématisé","Il s’agit d’un SCA ST- car la douleur dure depuis plus de 20 min"],"ABCD","E faux : sus-décalage persistant ST dans ≥ 2 dérivations contiguës = ST+. Facteurs de risque : diabète, dyslipidémie, tabac. Diagnostics à éliminer : DAo, péricardite."],
["Cas clinique 2","Femme de 50 ans, diabétique, hypertendue, tabagique : douleur rétro-sternale irradiant au bras gauche, déjà ressentie à l’effort depuis quelques mois (cédant à l’arrêt), mais cette fois intense, au repos, depuis 2 h. ECG : sus-décalage ST en V1–V4, sous-décalages en miroir (II, III, aVF, V5–V6). Quels éléments sont justes ?",["L’histoire traduit une aggravation d’un angor stable","Le diagnostic est un SCA ST+ antérieur","Les sous-décalages inférieurs/latéraux sont des images en miroir","Il s’agit d’une péricardite virale","Il faut attendre la troponine pour affirmer le diagnostic"],"ABC","D faux : péricardite = sus-décalage diffus, concave, sans miroir. E faux : le ST+ est un diagnostic ECG (< 10 min) ; la troponine est élevée mais ne doit pas retarder la prise en charge."]
];
const L="ABCDE";let done=0,score=0;const root=document.getElementById("qs");
Q.forEach((x,i)=>{const d=document.createElement("div");d.className="q";
d.innerHTML=`<div class="t">Q${i+1} · ${x[0]}</div><h2>${x[1]}</h2>`+x[2].map((o,j)=>`<label><input type="checkbox" value="${L[j]}"><b>${L[j]}.</b><span>${o}</span></label>`).join("")+`<button>Valider</button><div class="res"></div><div class="ex"><b>Justification :</b> ${x[3]}</div>`;
d.querySelector("button").onclick=function(){const labs=[...d.querySelectorAll("label")],ch=labs.map(l=>l.querySelector("input"));
let ok=true;labs.forEach((l,j)=>{const c=ch[j].checked,r=x[3-0===0?0:3]===undefined?0:0;const good=x[3-1+0]===undefined?0:0;
const correct=x[3-1].includes(L[j]);ch[j].disabled=true;
if(c&&correct)l.classList.add("ok");else if(c&&!correct){l.classList.add("ko");ok=false}else if(!c&&correct){l.classList.add("miss");ok=false}});
const r=d.querySelector(".res");r.style.display="block";r.style.color=ok?"var(--ok)":"var(--ko)";r.textContent=(ok?"✔ Correct":"✘ Incorrect")+" — réponses : "+x[3-1].split("").join(", ");
d.querySelector(".ex").style.display="block";this.remove();done++;if(ok)score++;
document.getElementById("pg").textContent=done+"/30 validées";document.getElementById("sc").textContent="Score : "+score;
if(done===30){const f=document.getElementById("fin");f.style.display="block";f.innerHTML=`<b>Résultat final : ${score}/30</b> (${Math.round(score/30*100)} %)`}};
root.appendChild(d)});
</script>
</body>
</html>
