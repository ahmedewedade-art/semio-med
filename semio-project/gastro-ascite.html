<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QCM – L'ascite</title>
<style>
:root{--ink:#1d2b33;--bg:#f3f6f4;--card:#fff;--line:#d5dedb;--amb:#b7791f;--teal:#0f6b6b;--ok:#1e7b4a;--bad:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
header{background:var(--teal);color:#fff;padding:22px 16px 18px;text-align:center}
h1{font:700 24px/1.25 Georgia,serif;margin:0 0 4px}
header p{margin:0;opacity:.9;font-size:14px}
#bar{position:sticky;top:0;background:var(--ink);color:#fff;padding:8px 16px;display:flex;justify-content:space-between;font-size:14px;z-index:5}
main{max-width:760px;margin:0 auto;padding:14px 12px 60px}
.q{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--amb);border-radius:8px;padding:14px;margin:14px 0}
.q h3{font:700 16px/1.4 Georgia,serif;margin:0 0 10px}
.q label{display:flex;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;margin:6px 0;cursor:pointer}
.q label b{min-width:16px;color:var(--teal)}
.q input{margin-top:5px;accent-color:var(--teal)}
.q label.ok{background:#e4f3ea;border-color:var(--ok)}
.q label.bad{background:#fbe6e4;border-color:var(--bad)}
.q label.miss{border:2px dashed var(--ok)}
button{background:var(--teal);color:#fff;border:0;border-radius:6px;padding:9px 16px;font:600 15px system-ui;cursor:pointer;margin-top:6px}
button:focus-visible,input:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
.ex{display:none;margin-top:10px;padding:10px 12px;background:#faf3e3;border-radius:6px;font-size:14.5px}
.ex.on{display:block}
.ex strong{color:var(--ok)}
#end{display:none;text-align:center;font:700 20px Georgia,serif;margin:20px 0}
#end button{background:var(--amb)}
</style></head><body>
<header><h1>L'ascite</h1><p>46 QCM difficiles · 5 propositions · une ou plusieurs réponses exactes</p></header>
<div id="bar"><span id="prog">0 / 46 validées</span><span id="sc">Score : 0</span></div>
<main id="m"></main>
<div id="end"></div>
<script>
// [énoncé, [A,B,C,D,E], réponses exactes, explication]
const Q=[
["Introduction et définition de l'ascite :",["Accumulation de liquide dans la cavité péritonéale, non hémorragique et non purulente","Le diagnostic positif est clinique","Les 2 causes principales sont l'HTP sur cirrhose et la tuberculose péritonéale","L'ascite est par définition hémorragique","Le diagnostic positif repose obligatoirement sur la ponction"],"ABC","D faux : par définition non hémorragique et non purulente (sinon hémopéritoine ou péritonite). E faux : le diagnostic positif est clinique."],
["Diagnostic positif d'une ascite de moyenne ou grande abondance :",["Inspection : augmentation de volume de l'abdomen d'importance variable","Grande abondance : déplissement de l'ombilic et diastasis des muscles droits","Percussion : matité déclive des flancs et de l'hypogastre encadrant un tympanisme péri-ombilical à limite concave vers le haut","Palpation : signe du flot et signe du glaçon","Percussion : matité péri-ombilicale avec tympanisme des flancs"],"ABCD","E faux : c'est l'inverse (matité déclive des flancs, tympanisme péri-ombilical)."],
["Ascite de faible abondance :",["Diagnostic plus difficile","Évoquée devant une prise de poids récente et/ou une augmentation du périmètre ombilical","L'échographie abdominale est d'un grand intérêt","Le signe du flot est toujours présent","L'échographie peut guider la ponction (ascite faible ou cloisonnée)"],"ABCE","D faux : l'examen clinique est pauvre quand l'ascite est de faible abondance."],
["Ponction du liquide d'ascite :",["Réalisée de façon stérile, en pleine matité","Point : union du 1/3 externe et des 2/3 internes de la ligne ombilic–épine iliaque antéro-supérieure droite","Liquide réparti sur 3 tubes : cytologie, anapath, biochimie","Cytologie : taux de lymphocytes, PNN et GR","Biochimie : cholestérol, triglycérides, LDH, glucose, protides et albumine (avec albumine sérique pour le gradient)"],"ACDE","B faux : le point se situe à gauche (épine iliaque antéro-supérieure gauche). L'anapath recherche les cellules malignes."],
["Diagnostics différentiels devant une augmentation du volume de l'abdomen :",["Globe vésical","Tumeur ou gros kyste ovarien","Obésité avec tympanisme diffus","Météorisme abdominal","Grossesse méconnue"],"ABDE","C faux : l'obésité donne une matité diffuse. L'échographie tranche en cas de doute."],
["Devant une collection péritonéale à l'échographie :",["Le contexte clinique est souvent évocateur","La ponction peut montrer un hémopéritoine","La ponction peut montrer une péritonite purulente","Il s'agit toujours d'une ascite vraie","Le diagnostic différentiel se fait uniquement par scanner"],"ABC","D faux : hémopéritoine et péritonite purulente sont des diagnostics différentiels. E faux : c'est la ponction qui oriente."],
["Complications mécaniques de l'ascite :",["Dyspnée par compression diaphragmatique et/ou épanchement pleural","Hernie de la paroi","Étranglement herniaire, éventration","Rupture de l'ombilic (érosion cutanée sur hernie) : grave, risque d'infection du LA","Diagnostic difficile et traitement différé"],"ABCD","E faux : diagnostic évident et traitement urgent."],
["Infection du liquide d'ascite :",["À rechercher systématiquement par la ponction","Complique surtout les ascites d'origine cirrhotique","Diagnostic : PNN > 250 éléments/mm³","Traitement : antibiotiques en urgence","Complique surtout l'ascite néoplasique"],"ABCD","E faux : surtout les ascites cirrhotiques."],
["Troubles hydro-électrolytiques de l'ascite :",["Dyskaliémie et dysnatrémie","Souvent favorisés par les diurétiques","Possibles en cas d'insuffisance rénale aiguë","Ce sont des complications mécaniques","Ils contre-indiquent toute ponction"],"ABC","D faux : complications métaboliques (3e groupe). E faux : non précisé et non fondé."],
["Orientation diagnostique devant une ascite :",["Interrogatoire : âge, ATCD personnels et familiaux de tuberculose, de néoplasie, contage viral, tares connues","Signes associés : IHC, HTP, insuffisance cardiaque","Examen : foie, signes d'IHC et d'HTP, cardio-vasculaire, pleuro-pulmonaire, ganglions","Toucher pelvien (TR, TV) ++++","L'examen se limite à l'abdomen"],"ABCD","E faux : examen général complet, avec le toucher pelvien (nodules péritonéaux)."],
["Examens complémentaires de l'enquête étiologique :",["Deux examens clefs : analyse du LA et échographie abdominale","L'IDR à la tuberculine et la radio thorax sont les deux examens clefs","Bilan hépatique : GOT, GPT, bilirubine, PAL, GGT, TP, EPP","Sérologies virales B, C et D, AFP, cuprurie, cuprémie, céruloplasmine, ferritinémie, CST","FOGD si suspicion d'HTP ; PBH, TDM, laparoscopie ; bilan rénal, écho-cœur"],"ACDE","B faux : l'IDR et la radio thorax sont des examens complémentaires, pas les examens clefs."],
["Cirrhose décompensée (ascite pauvre en protides < 25 g/L) :",["Diagnostic facile si cirrhose connue","Clinique : hépatomégalie molle à bord mousse","Biologie : TP, facteur V et albumine diminués ; ponction : liquide jaune citrin, pauvre en protides","Écho : dysmorphie du foie, signes d'HTP ; FOGD : varices œsophagiennes, gastropathie hypertensive","CAT : étiologie de la cirrhose ; traitement de l'ascite : diurétiques + régime hyposodé"],"ACDE","B faux : HPM dure à bord antérieur tranchant, avec signes d'HTP et d'IHC."],
["Ascites pauvres en protides en dehors de la cirrhose :",["Insuffisance cardiaque globale","Syndrome néphrotique","Syndrome de malabsorption et entéropathie exsudative","Syndrome de Demons-Meigs : pleurésie, ascite, tumeur ovarienne","Tuberculose péritonéale"],"ABCD","E faux : la tuberculose péritonéale donne une ascite riche en protides (> 25 g/L)."],
["Tuberculose péritonéale (clinique) :",["Fréquente dans notre contexte","Touche essentiellement les sujets âgés","ATCD de TBK, contage TBK récent","AEG, fièvre, sueurs nocturnes, douleurs abdominales diffuses, parfois masse abdominale","Rechercher d'autres localisations : pulmonaire, ganglionnaire, digestive"],"ACDE","B faux : touche essentiellement les sujets jeunes."],
["Tuberculose péritonéale (paraclinique) :",["Ponction : exsudative, lymphocytaire > 80 %","ADA et recherche de BK","Échographie : adénopathies, ascite cloisonnée","Cœlioscopie : hyperhémie, adhérences, granulations blanchâtres","Microscopie : granulome épithélio-giganto-cellulaire avec nécrose caséeuse constante"],"ABCD","E faux : la nécrose caséeuse est inconstante (+/-)."],
["Ascite néoplasique :",["Tumeur de l'ovaire la plus fréquente, puis digestive, puis mammaire","Ascite récidivante, douleurs abdominales, AEG +++, parfois sub-occlusion","Palpation de nodules péritonéaux (TR ++)","Ponction : exsudative, hémorragique, cellules malignes","Primitif la plus fréquente : mammaire, puis digestive, puis ovarienne"],"ABCD","E faux (et contradictoire avec A). La laparoscopie avec anapath confirme ; on recherche ensuite le primitif."],
["Carcinose péritonéale (schéma de synthèse) :",["Diagnostic évident si tumeur primitive connue","Sinon : TDM TAP, FOGD, coloscopie, examen gynécologique spécialisé","Cellules malignes dans le LA dans environ 60 % des cas","La laparoscopie est l'examen de choix (+++)","Les cellules malignes sont retrouvées dans 100 % des cas"],"ABCD","E faux : 60 % seulement, d'où l'intérêt de la laparoscopie."],
["Ascite de l'insuffisance cardiaque :",["Clinique : ascite + OMI","HPM + reflux hépato-jugulaire + turgescence des veines jugulaires","Échographie : dilatation des veines sus-hépatiques et de la VCI","Échographie : veines sus-hépatiques collabées","Écho-cœur + Rx thorax confirment ; étiologies : PCC, valvulopathie tricuspidienne"],"ABCE","D faux : dilatation des VSH et de la VCI."],
["Classement du liquide d'ascite (schéma du cours) :",["L'insuffisance cardiaque globale est citée parmi les ascites pauvres en protides (< 25 g/L)","Ascite cardiaque et Budd-Chiari : taux de protides variable","Budd-Chiari : classé dans les HTP (gradient > 11 g/L), surtout riche en protides","Entéropathie exsudative et syndrome néphrotique : gradient < 11 g/L, pas d'HTP","Cirrhose : gradient d'albumine < 11 g/L"],"ABCD","E faux : cirrhose = gradient > 11 g/L (HTP). Remarque : le schéma classe l'IC globale dans < 11, alors que les références usuelles (EASL) retiennent un GASA ≥ 11 g/L dans l'ascite cardiaque (congestion hépatique)."],
["Syndrome de Budd-Chiari :",["Obstruction ou compression des veines sus-hépatiques","Clinique : HPM + ascite","Confirmation : écho-doppler hépatique + angio-TDM","Ascite surtout riche en protides","Confirmation par la FOGD"],"ABCD","E faux : la FOGD recherche des signes d'HTP, pas le diagnostic de Budd-Chiari."],
["Ascite pancréatique :",["Pancréatite aiguë nécrosante","Fistule entre le Wirsung et le péritoine le plus souvent","Pleurésie gauche associée","Ascite exsudative riche en amylase","Ascite pauvre en protides avec amylase basse"],"ABCD","E faux : exsudative et riche en amylase."],
["Autres causes rares :",["Hypothyroïdie (myxœdème) : ascite riche en protéines et en cholestérol","Connectivites : lupus, sarcoïdose","Gastro-entérite à éosinophiles : ascite riche en éosinophiles","Hypothyroïdie : ascite pauvre en cholestérol","Gastro-entérite à éosinophiles : ascite riche en PNN"],"ABC","D faux : riche en cholestérol. E faux : riche en éosinophiles."],
["Ascite chyleuse :",["Aspect lactescent","Lipides > 1 g/L","Liquide à prédominance de PNN","Clinique : chylothorax, OMI durs et blancs","Causes : compression des voies lymphatiques (tumeur, ADP), malformation lymphatique, rupture du canal thoracique"],"ABDE","C faux : lymphocytaire."],
["Causes rares et exceptionnelles (schéma) :",["Blocs hépatiques : maladie veino-occlusive, bilharziose","Bloc infra-hépatique : thrombose ou compression de la porte","Ascite chyleuse et maladie gélatineuse du péritoine : évidentes par l'aspect du LA","Exceptionnelles : hypothyroïdie profonde, IRC terminale, lupus, périartérite noueuse, maladie de Whipple","La maladie de Whipple est une cause fréquente"],"ABCD","E faux : cause exceptionnelle."],
["Tuberculose péritonéale (schéma) :",["LA à prédominance lymphocytaire avec ADA > 33 U/L","IDR à la tuberculine","Recherche de contage TBK et de secondes localisations","Laparoscopie avec biopsie","Cellules malignes dans le LA dans 60 % des cas"],"ABCD","E faux : ce chiffre concerne la carcinose péritonéale."],
["Homme de 55 ans, éthylique : hépatomégalie dure à bord tranchant, ascite jaune citrin à 12 g/L de protides, gradient d'albumine à 20 g/L, varices œsophagiennes.",["Cirrhose décompensée","Ascite pauvre en protides","Gradient > 11 g/L : argument pour une HTP","Tuberculose péritonéale probable","Ponction pour rechercher une infection du LA (PNN > 250/mm³)"],"ABCE","D faux : la tuberculose donne une ascite riche en protides, lymphocytaire. Traitement : diurétiques + régime hyposodé."],
["Femme de 24 ans : fièvre, sueurs nocturnes, AEG, douleurs abdominales diffuses, ascite exsudative lymphocytaire à 85 %, échographie : adénopathies et ascite cloisonnée.",["Tuberculose péritonéale","Ponction guidée par l'échographie (ascite cloisonnée)","Cœlioscopie avec biopsie en cas de doute","Cirrhose décompensée","ADA et recherche de BK utiles"],"ABCE","D faux : liquide exsudatif lymphocytaire et contexte infectieux, non cirrhotique."],
["Femme de 60 ans : AEG, ascite récidivante hémorragique et exsudative, nodules péritonéaux au TR, tableau de sub-occlusion.",["Carcinose péritonéale","Tumeur ovarienne : primitif le plus fréquent","Cellules malignes et laparoscopie avec anapath pour confirmer","Ascite pauvre en protides","Recherche du primitif"],"ABCE","D faux : l'ascite néoplasique est exsudative."],
["Patient avec ascite + OMI, hépatomégalie, reflux hépato-jugulaire, turgescence jugulaire, VSH et VCI dilatées à l'échographie.",["Ascite d'origine cardiaque","Écho-cœur et Rx thorax confirment","Étiologies possibles : PCC, valvulopathie tricuspidienne","Budd-Chiari confirmé par la FOGD","Ascite typiquement chyleuse"],"ABC","D faux : Budd-Chiari = écho-doppler hépatique + angio-TDM. E faux : chyleuse = aspect lactescent, lipides > 1 g/L."],
["Valeurs seuils à connaître :",["Infection du LA : PNN > 250 éléments/mm³","Ascite pauvre en protides : < 25 g/L ; riche : > 25 g/L","Ascite chyleuse : lipides > 1 g/L","Tuberculose péritonéale : lymphocytes > 80 %","Tuberculose péritonéale : ADA > 133 U/L"],"ABCD","E faux : le cours cite ADA > 33 U/L (schéma)."],
["Gradient d'albumine :",["Il compare l'albumine du sérum à celle du liquide d'ascite","Gradient > 11 g/L : HTP","Gradient < 11 g/L : pas d'HTP","L'albumine sérique est dosée en même temps que celle du LA","Il se calcule à partir des protides totaux du LA"],"ABCD","E faux : il se calcule à partir de l'albumine (sérum et LA), pas des protides totaux."],
["Aspect et nature du liquide selon l'étiologie :",["Cirrhose : jaune citrin, pauvre en protides","Tuberculose : exsudative, lymphocytaire","Néoplasique : exsudative, hémorragique, cellules malignes","Pancréatique : exsudative, riche en amylase","Chyleuse : lactescente, riche en PNN"],"ABCD","E faux : chyleuse = lactescente, lipides > 1 g/L, lymphocytaire."],
["Apport de l'échographie abdominale :",["Dysmorphie du foie et signes d'HTP : cirrhose","Dilatation des VSH et de la VCI : insuffisance cardiaque","Adénopathies et ascite cloisonnée : tuberculose","Écho-doppler : obstruction des VSH (Budd-Chiari)","Inutile en cas d'ascite de faible abondance"],"ABCD","E faux : elle est très utile dans l'ascite de faible abondance et guide la ponction."],
["Orientation clinique :",["Fièvre et sueurs nocturnes : tuberculose péritonéale","Ascite récidivante, AEG +++, sub-occlusion : néoplasie","Ascite + OMI + reflux hépato-jugulaire : insuffisance cardiaque","HPM dure à bord tranchant : cirrhose","OMI durs et blancs avec chylothorax : ascite pancréatique"],"ABCD","E faux : ce tableau évoque l'ascite chyleuse."],
["Épanchement pleural et ascite :",["Ascite pancréatique : pleurésie gauche associée","Syndrome de Demons-Meigs : pleurésie + ascite + tumeur ovarienne","Une ascite abondante peut s'accompagner d'une dyspnée par épanchement pleural","Ascite chyleuse : chylothorax possible","Ascite pancréatique : pleurésie droite typique"],"ABCD","E faux : pleurésie gauche."],
["Associations étiologie – argument :",["Budd-Chiari – écho-doppler hépatique + angio-TDM","Tuberculose – ADA, BK, cœlioscopie","Ascite pancréatique – amylase élevée","Hypothyroïdie – protéines et cholestérol élevés","Gastro-entérite à éosinophiles – lipides > 1 g/L"],"ABCD","E faux : ascite riche en éosinophiles."],
["Biologie de l'enquête étiologique :",["Sérologies virales B, C et D","AFP","Cuprurie, cuprémie, céruloplasmine","Ferritinémie et coefficient de saturation de la transferrine","Seule la sérologie VIH est demandée"],"ABCD","E faux : aucune mention de la sérologie VIH dans le cours."],
["FOGD et examens associés :",["Indiquée si suspicion d'HTP","Recherche des varices œsophagiennes","Recherche une gastropathie hypertensive","Permet de diagnostiquer la tuberculose péritonéale","PBH, TDM abdomino-pelvien et laparoscopie sont d'autres examens possibles"],"ABCE","D faux : la tuberculose se prouve par ponction (ADA, BK) et cœlioscopie avec biopsie."],
["Classer les complications :",["Dyspnée par compression diaphragmatique : mécanique","Rupture de l'ombilic : mécanique","Infection du LA : infectieuse","Dysnatrémie : hydro-électrolytique","Étranglement herniaire : infectieuse"],"ABCD","E faux : complication mécanique."],
["Infection du liquide d'ascite (conduite) :",["Ponction systématique pour la rechercher","PNN > 250/mm³","Antibiotiques en urgence","Surtout chez le cirrhotique","On attend la culture avant de traiter"],"ABCD","E faux : l'antibiothérapie est urgente."],
["Patient : ascite lactescente, lipides 3 g/L, lymphocytaire, chylothorax, OMI durs et blancs.",["Ascite chyleuse","Compression des voies lymphatiques (tumeur, ADP) possible","Cirrhose décompensée","Malformation lymphatique congénitale possible","Rupture traumatique ou chirurgicale du canal thoracique possible"],"ABDE","C faux : la cirrhose donne un liquide jaune citrin pauvre en protides."],
["Patient avec pancréatite aiguë nécrosante, ascite riche en amylase et pleurésie gauche.",["Ascite pancréatique","Ascite exsudative","Fistule entre le Wirsung et le péritoine probable","Transsudat pauvre en protides","Pleurésie gauche associée"],"ABCE","D faux : exsudative."],
["Femme avec pleurésie, ascite et tumeur ovarienne.",["Syndrome de Demons-Meigs","Cité parmi les ascites pauvres en protides en dehors de la cirrhose","Triade : pleurésie, ascite, tumeur ovarienne","Tuberculose péritonéale","Insuffisance cardiaque systématique"],"ABC","D et E faux : ce tableau définit le syndrome de Demons-Meigs."],

];
const m=document.getElementById("m"),L="ABCDE";let done=0,score=0;
function h(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
Q.forEach((q,i)=>{
 const s=h("section","q");s.appendChild(h("h3",0,(i+1)+". "+q[0]));
 const labs=q[1].map((t,j)=>{const l=h("label");const c=document.createElement("input");c.type="checkbox";l.append(c,h("b",0,L[j]),h("span",0,t));s.appendChild(l);return[l,c]});
 const b=h("button",0,"Valider");const ex=h("div","ex");
 b.onclick=()=>{
  let all=true;
  labs.forEach(([l,c],j)=>{const ok=q[2].includes(L[j]);c.disabled=true;
   if(ok&&c.checked)l.classList.add("ok");else if(!ok&&c.checked){l.classList.add("bad");all=false}else if(ok){l.classList.add("miss");all=false}});
  const st=h("strong",0,(all?"Exact · ":"Inexact · ")+"Réponses : "+q[2].split("").join(", "));
  ex.append(st,document.createElement("br"),document.createTextNode(q[3]));ex.classList.add("on");

  if(done===Q.length){const e=document.getElementById("end");e.style.display="block";e.textContent="Score final : "+score+" / "+Q.length+" ";const r=h("button",0,"Recommencer");r.onclick=()=>location.reload();e.appendChild(r)}
 };
 s.append(b,ex);m.appendChild(s);
});
